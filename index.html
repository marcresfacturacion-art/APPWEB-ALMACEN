<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Almacén Marcres</title>
<meta name="description" content="Inventario del almacén de Marcres y Rivagua: escanear, sacar y meter material.">
<meta name="theme-color" content="#1597dc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almacén">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one-column phone app, sticky header, big touch targets; Marcres brand: celeste and white (logo blue ~#24adfc, deepened for text contrast) */
:root{
  --bg:#f4fbff; --surface:#def1fc; --surface-2:#c8e7fa; --fg:#0d2a3d; --muted:#45606f; --line:#a7d3ee;
  --accent:#1597dc; --accent-fg:#ffffff; --brand:#1597dc; --brand-fg:#ffffff; --danger:#c8372d; --ok:#2f8a4e;
  --sh-azul:#2f5fd0; --sh-rojo:#d2392f; --sh-gris:#8a96a3; --sh-negro:#20262d; --sh-celeste:#3fb0e6; --sh-verde:#2f9e55; --sh-marron:#8a5a2b; --sh-loan:#7a4fd0; --cb-amarillo:#f2c014; --cb-naranja:#f07a1f; --cb-rosa:#e2559b; --cb-turquesa:#14a89a; --cb-lima:#9ccc2e; --cb-dorado:#c99a1e; --cb-bombas:#cdb38a; --cb-cajas:#f2a27a; --cb-menta:#8fdcc2; --cb-blanco:#ffffff; --cb-lavanda:#c3b1f0; --cb-granate:#8e1b45;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1a24; --surface:#12293a; --surface-2:#1b3a51; --fg:#e4f3fd; --muted:#9bb9cc; --line:#28495f;
  --accent:#3db3f0; --accent-fg:#06202f; --brand:#1478b0; --brand-fg:#ffffff; --danger:#ef6157; --ok:#4cbc72; --sh-negro:#c9d2db; --sh-gris:#7d8995; --sh-loan:#a98bf0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1a24; --surface:#12293a; --surface-2:#1b3a51; --fg:#e4f3fd; --muted:#9bb9cc; --line:#28495f;
  --accent:#3db3f0; --accent-fg:#06202f; --brand:#1478b0; --brand-fg:#ffffff; --danger:#ef6157; --ok:#4cbc72; --sh-negro:#c9d2db; --sh-gris:#7d8995; --sh-loan:#a98bf0; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.scanner{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanframe{position:relative;width:min(70vw,300px);aspect-ratio:1;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.scanmsg{position:relative;color:#fff;font-weight:600;margin:18px 16px 0;text-align:center;text-shadow:0 1px 3px #000}
.scanbar{position:absolute;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.scanbar .btn{flex:1;min-width:0;padding-left:6px;padding-right:6px;font-size:14px}
.scanwarn{position:absolute;left:16px;right:16px;top:42%;transform:translateY(-50%);background:#d32f2f;color:#fff;font-weight:800;font-size:24px;text-align:center;padding:16px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.5);z-index:2}
a.btn{text-decoration:none;color:inherit;display:flex;justify-content:center;align-items:center}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-fg);padding:10px 16px;display:flex;align-items:center;gap:12px}
.top h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#e_nombre,#e_desc,#e_prov{text-transform:uppercase}
.rack{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.row.sel{outline:3px solid var(--accent,#1597dc)}
#e_barbox .name,#b_web .name{white-space:normal;overflow:visible;text-overflow:clip}
#e_barbox .snip,#b_web .snip{font-size:13px;color:var(--muted);margin-top:2px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.webrest .row{opacity:.75}
.best{display:flex;flex-direction:column;gap:6px;background:var(--bg);border:2px solid var(--brand,#1597dc);border-radius:12px;padding:12px}.best .name{font-weight:700;font-size:17px;white-space:normal}.best .code{font-size:13px;color:var(--muted)}
#e_barbox .list{min-width:0}
.top h1.long{font-size:15px;letter-spacing:.02em;white-space:normal;line-height:1.15}
.top .tag{background:var(--brand-fg);color:var(--brand);font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.08em;padding:2px 8px;border-radius:3px}
.iconbtn{background:none;border:0;color:inherit;width:40px;height:40px;display:grid;place-items:center;border-radius:6px;cursor:pointer;flex:none}
.iconbtn svg{width:24px;height:24px}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:16px}
.label{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:8px;border:2px solid var(--line);background:var(--surface);font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.btn svg{width:22px;height:22px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;height:52px;padding:0 14px;border-radius:8px;border:2px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:16px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.thumb{width:52px;height:52px;border-radius:6px;background:var(--surface-2);flex:none;display:grid;place-items:center;overflow:hidden;font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover}
.row .txt{flex:1;min-width:0}
.row .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.qty{font-family:var(--f-display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;text-align:right;min-width:44px}
.qty.low{color:var(--danger)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:2px;flex:none}
.row.catrow .name{color:var(--muted)}
.row.catrow .thumb{background:none;border:1px dashed var(--line);color:var(--muted)}
.catnote{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-weight:600;color:var(--muted)}
.prices{display:flex;gap:18px;flex-wrap:wrap}
.prices b{font-size:18px;color:var(--fg)}
.pill{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:3px;background:var(--surface-2);color:var(--muted);margin-left:6px;vertical-align:2px}
.empty{padding:24px 16px;text-align:center;color:var(--muted)}
.photo{aspect-ratio:4/3;max-width:100%;width:100%;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;font-family:var(--f-display);font-size:64px;font-weight:700;color:var(--muted)}
.photo img{width:100%;height:100%;object-fit:cover}
.ficha h2{margin:0;font-family:var(--f-display);font-size:30px;line-height:1.1;text-wrap:balance}
.ficha p{margin:0;color:var(--muted)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fact .big{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.locbtn{border:0;background:none;padding:0;text-align:left;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:22px;text-decoration:underline;text-underline-offset:3px}
.stock{background:var(--surface);border:2px solid var(--fg);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper input{width:90px;height:52px;text-align:center;border-radius:8px;border:2px solid var(--line);background:var(--bg);font-family:var(--f-display);font-weight:700;font-size:26px}
.stepper .iconbtn{border:2px solid var(--line);width:52px;height:52px}
.twobtn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.out{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.in{background:var(--ok);border-color:var(--ok);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.log{display:flex;flex-direction:column;gap:6px;font-size:14px}
.log div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.log .d{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.d.neg{color:var(--danger)} .d.pos{color:var(--ok)}
.map{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
.map svg{width:100%;height:auto;display:block}
.map text{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.04em;fill:var(--fg)}
.shelf{cursor:pointer}
.shelf rect{stroke:var(--fg);stroke-width:1.5}
.shelf.on rect{stroke:var(--accent);stroke-width:5}
@keyframes pulse{50%{opacity:.35}}
.shelf.on rect{animation:pulse 1.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.shelf.on rect{animation:none}}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.legend button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;display:flex;gap:6px;align-items:center;cursor:pointer;font-size:14px;font-weight:600}
.legend button[aria-pressed="true"]{border-color:var(--fg);background:var(--surface-2)}
form.edit{display:flex;flex-direction:column;gap:12px}
form.edit label{display:flex;flex-direction:column;gap:4px;min-width:0}
form.edit input,form.edit select,form.edit textarea{width:100%;min-width:0}
form.edit input,form.edit select,form.edit textarea{min-height:48px;padding:10px 12px;border-radius:8px;border:2px solid var(--line);background:var(--surface)}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.qrcard{background:#fff;color:#111;border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.qrcard canvas,.qrcard img{width:100%;max-width:150px;height:auto}
.qrcard b{font-family:var(--f-display);font-size:16px;line-height:1.1}
.qrcard .code{color:#444}
.qrcard .pick{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.qrcard .pick input{width:20px;height:20px}
.qrprint{display:grid;gap:8px}
#printsheet{display:none}
@media print{
  @page{size:A4;margin:8mm}
  html,body{background:#fff!important;margin:0!important;padding:0!important}
  body>*:not(#printsheet){display:none!important}
  #printsheet{display:grid!important;grid-template-columns:repeat(4,var(--lbl));gap:3mm;justify-content:center}
  #printsheet .lbl{width:var(--lbl);height:var(--lbl);box-sizing:border-box;border:.2mm dashed #999;padding:2.5mm 1.5mm 1.5mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;break-inside:avoid;page-break-inside:avoid;color:#000;font-family:Arial,sans-serif;text-align:center;overflow:hidden}
  #printsheet .lbl img{width:calc(var(--lbl) * .60);height:calc(var(--lbl) * .60);flex:none;image-rendering:pixelated}
  #printsheet .lbl b{font-size:calc(var(--lbl) * .062);line-height:1.15;max-height:2.3em;flex:none;margin-top:.6mm;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;width:100%}
  #printsheet .lbl span{flex:none;font-size:calc(var(--lbl) * .09);font-weight:700;font-family:monospace}
}
.qrcard button{border:1px solid #bbb;background:#f4f4f4;color:#111;border-radius:6px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer}
.groups{display:flex;flex-direction:column;gap:8px}
.roomlbl{margin-top:6px}
.roomtabs{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--brand);border:2px solid var(--brand);border-radius:10px;overflow:hidden}
.roomtabs button{border:0;background:var(--surface);min-height:46px;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.roomtabs button[aria-pressed="true"]{background:var(--brand);color:var(--brand-fg)}
.group{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.group summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:54px;padding:0 14px;cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.03em}
.group summary::-webkit-details-marker{display:none}
.group .gname{flex:1}
.group .gcount{font-family:var(--f-body);font-size:14px;font-weight:600;color:var(--muted);background:var(--surface-2);border-radius:20px;padding:2px 10px;font-variant-numeric:tabular-nums}
.group .chev{width:20px;height:20px;transition:transform .15s}
.group[open] .chev{transform:rotate(180deg)}
.group .list{border:0;border-top:1px solid var(--line);border-radius:0}
.group .dot{width:14px;height:14px}
.whobtn{display:flex;align-items:center;gap:6px;background:none;border:1px solid currentColor;color:inherit;border-radius:20px;padding:5px 10px;font-weight:600;font-size:14px;cursor:pointer;max-width:45%;min-width:0}
.whobtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.whobtn svg{width:16px;height:16px;flex:none}
.login{display:flex;flex-direction:column;gap:14px;padding-top:12px}
.login h2{margin:0;font-family:var(--f-display);font-size:30px;line-height:1.1;text-wrap:balance}
.login .lock{width:56px;height:56px;border-radius:12px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.login .lock svg{width:30px;height:30px}
.techpick{min-height:56px}
.techpick .go{font-weight:700;font-size:14px;background:var(--accent);color:var(--accent-fg);padding:6px 12px;border-radius:6px}
.field{display:flex;flex-direction:column;gap:4px}
.check{display:flex!important;flex-direction:row!important;align-items:flex-start;gap:10px;font-size:16px}
.check input{width:24px;height:24px;flex:none;margin:0}
form.edit .check input{width:24px;height:24px;min-height:0;padding:0;flex:none}
form.edit .check span{flex:1;min-width:0}
.field select,.field input,.filters select,.filters input,#t_name{min-height:52px;padding:10px 12px;border-radius:8px;border:2px solid var(--line);background:var(--surface);font-size:17px;width:100%;min-width:0}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-weight:600;cursor:pointer;padding:8px 0;align-self:center}
.linkbtn.danger{color:var(--danger);align-self:auto;padding:4px 0}
.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;background:var(--brand);border:2px solid var(--brand);border-radius:10px;overflow:hidden}
.tabs button{border:0;background:var(--surface);min-height:46px;padding:0 2px;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.tabs button:last-child:nth-child(odd){grid-column:1/-1}
.tabs button[aria-selected="true"]{background:var(--brand);color:var(--brand-fg)}
#adm{display:flex;flex-direction:column;gap:12px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters input{grid-column:1/-1}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;cursor:pointer}
.hrow:last-child{border-bottom:0}
.hrow .txt{flex:1;min-width:0}
.hrow .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htipo{flex:none;width:74px;text-align:center;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 0;border-radius:4px;background:var(--surface-2);color:var(--muted)}
.htipo.t-salida{background:var(--danger);color:#fff}
.htipo.t-entrada{background:var(--ok);color:#fff}
.htipo.t-alta{background:var(--accent);color:var(--accent-fg)}
.htipo.t-prestamo{background:var(--sh-azul);color:#fff}
.htipo.t-devolucion{background:var(--ok);color:#fff}
.htipo.t-recuento{background:var(--fg);color:var(--bg)}
.hwho .com{color:var(--fg);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.destbar{display:flex;align-items:center;justify-content:space-between;gap:10px;border:2px solid var(--fg);border-radius:10px;padding:10px 12px;background:var(--surface);font-size:15px}
.destbar span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bigyes{min-height:72px;font-size:22px}
.sheet{display:flex;flex-direction:column;gap:10px;border:2px solid var(--fg);border-radius:12px;padding:14px;background:var(--surface)}
.sheet h3{margin:0;font-family:var(--f-display);font-size:20px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg .btn[aria-pressed="true"]{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.sug{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sug button{border:0;border-bottom:1px solid var(--line);background:var(--surface);text-align:left;padding:12px;font-size:16px;cursor:pointer}
.sug button:last-child{border-bottom:0}
.alert{display:flex;align-items:center;gap:10px;width:100%;border:2px solid var(--danger);border-radius:10px;background:var(--surface);color:var(--danger);font-weight:700;padding:12px;text-align:left;cursor:pointer;font-size:16px}
.loan{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.loan:last-child{border-bottom:0}
.loan .txt{flex:1;min-width:0}
.loan .name{font-weight:600}
.loan .sub{font-size:13px;color:var(--muted)}
.rcrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.rcrow:last-child{border-bottom:0}
.rcrow .txt{flex:1;min-width:0}
.rcrow .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcrow input{width:84px;min-height:46px;border-radius:8px;border:2px solid var(--line);background:var(--surface);font-size:18px;text-align:center;flex:none}
.rcrow input.diff{border-color:var(--danger)}
.rcok{color:var(--brand);font-weight:700}
.cnt{background:var(--surface);border:2px solid var(--brand);border-radius:12px;padding:14px;display:grid;gap:12px}
.cnt .ctop{display:flex;gap:12px;align-items:center}
.cnt .ctop .thumb{width:64px;height:64px;flex:none}
.cnt .pname{font-weight:700;font-size:18px}
.cnt .stepper{display:grid;grid-template-columns:1fr 1fr 2fr 1fr 1fr;gap:6px;align-items:stretch}
.cnt .stepper button{min-height:56px;border-radius:10px;border:2px solid var(--brand);background:var(--surface);font-size:18px;font-weight:700;cursor:pointer}
.cnt .stepper input::-webkit-inner-spin-button,.cnt .stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.cnt .wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cnt .wgrid input{width:100%;min-height:48px;border-radius:8px;border:2px solid var(--line);background:var(--surface);font-size:18px;text-align:center}
.cnt .wres{font-size:18px;font-weight:700;color:var(--brand);text-align:center}
.cnt .stepper input{-moz-appearance:textfield;min-height:56px;border-radius:10px;border:2px solid var(--brand);font-size:28px;font-weight:700;text-align:center;width:100%;min-width:0}
.hwho{flex:none;display:flex;flex-direction:column;align-items:flex-end;font-size:13px;max-width:34%;min-width:0;text-align:right}

.hwho span{color:var(--muted);font-variant-numeric:tabular-nums}
.trow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.note{font-size:14px;color:var(--muted);margin:0}
.hidden-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links .btn{flex:1;min-width:140px;font-size:16px;min-height:46px}
</style>

<body>
<header class="top">
  <button class="iconbtn" id="back" aria-label="Volver al buscador" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <h1 id="title">Almacén</h1>
  <span class="tag" id="rotag" hidden>Solo ver</span>
  <button class="whobtn" id="who" hidden aria-label="Cerrar sesión"><span id="whoname"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg></button>
</header>

<main id="app">
  <div class="empty">Cargando…</div>
</main>

<input type="file" id="qrfile" class="hidden-file" accept="image/*" capture="environment" aria-label="Foto del código QR">
<input type="file" id="photofile" class="hidden-file" accept="image/*" capture="environment" aria-label="Foto del producto">
<div class="toast" id="toast" hidden></div>
<div class="scanner" id="scanner" hidden role="dialog" aria-label="Escanear código QR o de barras">
  <video id="scanvideo" muted playsinline></video>
  <div class="scanframe" aria-hidden="true"></div>
  <div class="scanwarn" id="scanwarn" hidden>¡No muevas el móvil!</div>
  <p class="scanmsg" id="scanmsg">Apunta al código QR</p>
  <div class="scanbar"><button class="btn" id="scanphoto">Hacer foto</button><button class="btn" id="scantype">Escribir número</button><button class="btn primary" id="scanclose">Cerrar</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>

/*__BOOT__*/
const BOOT = window.__BOOT || {};
/* Google Apps Script web app that owns the sheet (Code.gs + api.gs). The GitHub page talks to it with fetch. */
const API_URL = "https://script.google.com/macros/s/AKfycbwMxcgdZ6ru4q9l3j6-bDN9NwUoR7itOoHkXqAWf7H8zpHB9kqFUQD33En7RobZnWmB/exec";
const IN_GAS = !!(window.google&&google.script&&google.script.run);
const APP_URL = IN_GAS ? (BOOT.url||"") : location.origin + location.pathname;
if(!BOOT.p) BOOT.p = new URLSearchParams(location.search).get("p") || "";
/* Every read and write goes to the Apps Script server; stock changes run there under a lock. */
/* Every write is counted, so a refresh that was already on its way can't bring back what was just changed. */
const READ_FNS=new Set(["api_bootstrap","api_poll","api_techs","api_productMoves","api_history","api_adminLogin","api_catalog","api_barSearch","api_barIA"]);
let WSEQ=0, WBUSY=0;
function api(fn, ...args){
  if(READ_FNS.has(fn)) return apiRaw(fn, ...args);
  WSEQ++; WBUSY++;
  return apiRaw(fn, ...args).finally(()=>{ WBUSY--; WSEQ++; });
}
/* What this phone just changed wins for a couple of minutes over older copies from the server. */
const RECENT={gone:new Map(), added:new Map(), qty:new Map()}, RECENT_MS=120000;
function remember(kind,key,val){ RECENT[kind].set(key,{val,t:Date.now()}); }
function fresh(kind,key){ const e=RECENT[kind].get(key); if(!e) return null; if(Date.now()-e.t>RECENT_MS){ RECENT[kind].delete(key); return null; } return e; }
/* Sin cobertura de verdad, o el servidor de Google no contesta (por ejemplo, si a Código.gs le falta código). */
function netMsg(){ return navigator.onLine===false?"Sin conexión. Revisa la cobertura e inténtalo de nuevo.":"El servidor de Google no responde. Si acabas de cambiar Apps Script, pega servidor.gs entero en Código.gs y haz Nueva versión."; }
function apiRaw(fn, ...args){
  if(IN_GAS) return new Promise((res,rej)=>{
    google.script.run
      .withSuccessHandler(r=>{ if(r&&r.err) rej({...r, code:r.err}); else res(r); })
      .withFailureHandler(e=>rej({code:"network", msg:String(e&&e.message||e)}))[fn](...args);
  });
  // text/plain keeps it a "simple" request, so the browser sends it without a CORS preflight.
  return fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args}),redirect:"follow"})
    .then(r=>{ if(!r.ok) throw {code:"network", msg:"HTTP "+r.status}; return r.json(); },
          e=>{ throw {code:"network", msg:String(e&&e.message||e)}; })
    .then(r=>{ if(r&&r.err) throw {...r, code:r.err}; return r; },
          e=>{ throw e&&e.code ? e : {code:"network", msg:String(e&&e.message||e)}; });
}
/* Last good copy of the inventory, so the app opens instantly and the server refresh lands a moment later. */
const CACHE_KEY="almacen_cache_v1";
function saveCache(r){ try{ const keep={}; ["products","techs","loans","barras","niveles","lados","baldas","clientes","proveedores","hasPassword"].forEach(k=>{ if(r[k]!==undefined) keep[k]=r[k]; }); const old=loadCache()||{}; localStorage.setItem(CACHE_KEY, JSON.stringify({...old,...keep,at:Date.now()})); }catch(e){} }
function loadCache(){ try{ return JSON.parse(localStorage.getItem(CACHE_KEY)||"null"); }catch(e){ return null; } }
function saveFile(filename, data){
  const blob = data instanceof Blob ? data : new Blob([data],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000);
}
const SHELVES = {
  celeste:{name:"Estante celeste",color:"var(--sh-celeste)"},
  verde:  {name:"Estante verde",  color:"var(--sh-verde)"},
  gris:   {name:"Estante gris",   color:"var(--sh-gris)"},
  rojo:   {name:"Estante rojo",   color:"var(--sh-rojo)"},
  azul:   {name:"Estante azul",   color:"var(--sh-azul)"},
  marron: {name:"Estante marrón", color:"var(--sh-marron)"},
  negro:  {name:"Estante negro",  color:"var(--sh-negro)"},
  /* Cuarto blanco: lo eléctrico y las bombas. Colores que no se repiten en el almacén principal. */
  /* Según el segundo dibujo de Xavi (2026-10-06). */
  cb_bombas:    {name:"Zona de bombas",   color:"var(--cb-bombas)",   room:"cb"},
  cb_cajas:     {name:"Zona de cajas",    color:"var(--cb-cajas)",    room:"cb"},
  cb_tapiado:   {name:"Estante tapiado",  color:"var(--cb-dorado)",   room:"cb"},
  cb_blanca:    {name:"Blanca",           color:"var(--cb-blanco)",   room:"cb"},
  cb_blanco:    {name:"Blanco",           color:"var(--cb-blanco)",   room:"cb"},
  cb_almblanco: {name:"Almacén blanco",   color:"var(--cb-blanco)",   room:"cb"},
  cb_pq:        {name:"PQ",               color:"var(--cb-menta)",    room:"cb"},
  cb_e1:        {name:"Estante amarillo",        color:"var(--cb-amarillo)", room:"cb"},
  cb_e2:        {name:"Estante naranja",        color:"var(--cb-naranja)",  room:"cb"},
  cb_e3:        {name:"Estante rosa",        color:"var(--cb-rosa)",     room:"cb"},
  cb_e4:        {name:"Estante lima",        color:"var(--cb-lima)",     room:"cb"},
  cb_e5:        {name:"Estante turquesa",        color:"var(--cb-turquesa)", room:"cb"},
};
const ROOMS = {main:"Almacén principal", cb:"Cuarto blanco"};
const roomOf = k => (SHELVES[k]&&SHELVES[k].room)||"main";
const shelvesIn = room => Object.entries(SHELVES).filter(([k])=>roomOf(k)===room);
const EMPRESAS = ["Marcres","Rivagua"];
const LOAN_LOC = {name:"Préstamos", color:"var(--sh-loan)"};
const NO_LOC = {name:"Sin ubicación", color:"var(--line)"};
/* Loan items live in the "Préstamos" location, whatever shelf they had. */
const locOf = p => p.prestamo ? LOAN_LOC : (SHELVES[p.ubicacion] || NO_LOC);
const locKey = p => p.prestamo ? "prestamos" : (SHELVES[p.ubicacion] ? p.ubicacion : "none");
const locName = k => k==="prestamos" ? LOAN_LOC.name : k==="none" ? NO_LOC.name : SHELVES[k].name;
const isLow = p => Number(p.minimo)>0 && p.cantidad < Number(p.minimo);
const IDLE_MS = 15*60*1000;
const TIPOS = {salida:"Sacado", entrada:"Añadido", prestamo:"Préstamo", devolucion:"Devuelto", recuento:"Recuento", alta:"Alta", ajuste:"Ajuste", edicion:"Cambio", baja:"Baja"};

const S = { view:"login", code:null, q:"", products:new Map(), loaded:false, canWrite:true,
  db:null, user:null, assets:null, downloads:null, uid:null, moves:[], unMoves:null, mapSel:null, editCode:null, amount:1, busy:false, openGroups:new Set(),
  techs:[], techsLoaded:false, tecnico:null, pending:null, adminOk:false, adminDoc:undefined, adminTab:"hist", hist:[], unHist:null,
  hf:{tec:"", tipo:"", q:""}, hasPassword:false, adminToken:null, sheetUrl:"", sheet:null, destino:null, destStep:"q1", destNew:false, empresa:"", comunidad:"", clientes:[], appClients:[], listClients:[], proveedores:[], loans:[], rc:{shelf:"",counts:{},cur:null,val:"",done:{},w:false}, qrCm:4, qrSkip:new Set(), cat:null, catVer:null, catLoading:false, catSku:null, prefill:null, catImp:null, plate:null, niv:{}, lados:{}, baldas:{}, bars:new Map(), bar:"", barPick:null, minQ:"", adminWant:null, lastActive:Date.now(), tabId:Math.random().toString(36).slice(2) };

const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const normCode = s => String(s||"").trim().toUpperCase().replace(/\s+/g,"-").replace(/[^A-Z0-9._~-]/g,"");
const initials = n => String(n||"?").split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase();
const imgFor = p => p && p.foto ? "https://drive.google.com/thumbnail?id=" + encodeURIComponent(p.foto) + "&sz=w800" : null;
const BOM = String.fromCharCode(0xFEFF), LAST_CHAR = String.fromCharCode(0xFFFF);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const fold = s => String(s||"").normalize("NFD").replace(/\p{Mn}/gu,"").toLowerCase().trim();
const fmtDate = t => new Date(t).toLocaleString("es-ES",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"});

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,3000); }

const OPEN_VIEWS = new Set(["login","admin"]);
function go(view, extra={}){
  if (S.unMoves && !(view==="ficha" && extra.code===S.code)) { S.unMoves(); S.unMoves=null; S.moves=[]; }
  if (!S.tecnico && !OPEN_VIEWS.has(view)) { if(view==="ficha"&&extra.code) S.pending=extra.code; view="login"; extra={}; }
  if (S.tecnico && !S.destino && view!=="destino" && view!=="login") { if(view==="ficha"&&extra.code) S.pending=extra.code; view="destino"; extra={}; }
  if (!(view==="ficha" && extra.code===S.code)) S.sheet=null;
  S.prefill=null; S.newBar=null; S.editBar=null;
  Object.assign(S, {view}, extra);
  if (view==="ficha") watchMoves(S.code);
  render(); window.scrollTo(0,0);
}

/* ---------- Views ---------- */
function render(){
  if(!VIEWS[S.view]) S.view="buscar";
  $("#back").hidden = S.view==="buscar" || S.view==="login" || (S.view==="destino" && !S.destino);
  $("#rotag").hidden = S.canWrite;
  const who=$("#who"); who.hidden=!S.tecnico; if(S.tecnico) $("#whoname").textContent=S.tecnico.nombre;
  const titles={login:"Almacén Marcres", buscar:"Almacén", catitem:"Ficha", ficha:"Ficha", mapa:"Mapa", editar:S.editCode?"Editar producto":"Nuevo producto", barra:"Código de barras", admin:"Restringido", destino:"¿Para qué es?"};
  $("#title").textContent = titles[S.view]; $("#title").classList.toggle("long", titles[S.view].length>12);
  VIEWS[S.view]();
}
const VIEWS={login:viewLogin, buscar:viewSearch, catitem:viewCatItem, ficha:viewFicha, mapa:viewMap, editar:viewEdit, barra:viewBar, admin:viewAdmin, destino:viewDest};

const LOGIN_MIN=3;
function techMatches(q){
  const parts=fold(q).split(/\s+/).filter(Boolean);
  if(parts.join("").length<LOGIN_MIN) return [];
  return S.techs.filter(t=>t.activo!==false).filter(t=>{
    const words=fold(t.nombre).split(/\s+/);
    return parts.every(p=>words.some(w=>w.startsWith(p)));
  }).sort((a,b)=>a.nombre.localeCompare(b.nombre,"es")).slice(0,4);
}
function viewLogin(){
  const any=S.techs.some(t=>t.activo!==false);
  app.innerHTML = `<section class="login">
    <div class="lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
    <h2>¿Quién eres?</h2>
    <p class="note">Escribe tu nombre o apellido y tócalo para entrar. Cada producto que saques o ingreses quedará registrado a tu nombre.</p>
    ${!S.techsLoaded?'<div class="empty">Cargando técnicos…</div>':
      !any?'<div class="empty">Todavía no hay técnicos en la lista. Se añaden desde «Acceso restringido».</div>':
      `<label class="field"><span class="label">Tu nombre</span><input id="l_q" type="search" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Empieza a escribir…" value="${esc(S.loginQ||"")}"></label>
       <div id="l_res"></div>`}
    ${S.pending?`<p class="note">Después se abrirá el producto <b>${esc(S.pending)}</b>.</p>`:""}
    ${S.techsLoaded&&!any?'<button class="linkbtn" id="l_admin">Acceso restringido</button>':""}
  </section>`;
  const q=$("#l_q");
  if(q){
    q.oninput=()=>{ S.loginQ=q.value; drawLoginResults(); };
    q.onkeydown=e=>{ if(e.key==="Enter"){ const m=techMatches(q.value); if(m.length===1) login(m[0]); } };
    drawLoginResults();
    setTimeout(()=>{ try{ q.focus(); }catch(e){} },50);
  }
  const la=$("#l_admin"); if(la) la.onclick=()=>go("admin");
}
function drawLoginResults(){
  const box=$("#l_res"), q=$("#l_q"); if(!box||!q) return;
  const typed=fold(q.value).replace(/\s+/g,"").length;
  if(typed<LOGIN_MIN){ box.innerHTML=typed?`<p class="note">Sigue escribiendo…</p>`:""; return; }
  const m=techMatches(q.value);
  box.innerHTML = m.length
    ? `<div class="list">${m.map(t=>`<button class="row techpick" data-tec="${esc(t.id)}"><span class="txt"><div class="name">${esc(t.nombre)}</div></span><span class="go">Entrar</span></button>`).join("")}</div>`
    : `<div class="empty">No hay ningún técnico con ese nombre. Si eres nuevo, pide a Xavi que te añada.</div>`;
  box.querySelectorAll("[data-tec]").forEach(b=>b.onclick=()=>{ const t=m.find(x=>x.id===b.dataset.tec); if(t) login(t); });
}

function canRestricted(){
  if(!S.tecnico) return false;
  const t=S.techs.find(x=>x.id===S.tecnico.id);
  return !!(t&&t.restringido&&t.activo!==false);
}
function login(t){
  S.tecnico={id:t.id,nombre:t.nombre}; S.lastActive=Date.now(); S.loginQ="";
  S.destino=null; S.destStep="q1"; S.destNew=false; S.empresa=""; S.comunidad="";
  go("destino");
  toast(`Hola, ${t.nombre}`);
}
function logout(msg){
  if(S.cat&&S.cat.admin) S.cat={ver:S.cat.ver, items:S.cat.items.map(r=>r.slice(0,4)), admin:false};
  S.tecnico=null; S.adminOk=false; S.adminToken=null; S.changePw=false; S.hist=[]; S.q=""; S.sheet=null; S.destino=null; S.destStep="q1"; S.empresa=""; S.comunidad=""; S.rc={shelf:"",counts:{},cur:null,val:"",done:{},w:false};
  go("login"); if(msg) toast(msg);
}

function productRow(p){
  const sh = locKey(p)==="none" ? null : locOf(p);
  const img = imgFor(p);
  return `<button class="row" data-open="${esc(p.codigo)}">
    <span class="thumb">${img?`<img src="${img}" alt="">`:esc(initials(p.nombre))}</span>
    <span class="txt"><div class="name">${esc(p.nombre)}${p.ejemplo?'<span class="pill">Ejemplo</span>':''}</div>
      <div class="code">${esc(p.codigo)}</div>
      ${sh?`<span class="chip"><span class="dot" style="background:${sh.color}"></span>${sh.name}${nivLabel(p)?" · "+esc(nivLabel(p)):""}</span>`:""}</span>
    <span class="qty ${isLow(p)?'low':''}">${p.cantidad}</span></button>`;
}

function viewSearch(){
  const q = S.q.trim().toLowerCase();
  const all = [...S.products.values()].sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));
  const words = qWords(S.q);
  const bk = isBarText(S.q) ? barKey(S.q) : null, byBar = bk ? S.bars.get(bk) : null;
  const hits = q ? all.filter(p => p.codigo===byBar || hasWords(p.codigo+" "+p.nombre+" "+(p.descripcion||"")+" "+barsOf(p.codigo).join(" "), words)) : all;
  const cat = q ? catHits(words) : null;
  if(q) ensureCat();
  app.innerHTML = `
    ${S.destino?`<div class="destbar"><span>Para: <b>${esc(destLabel())}</b></span><button class="linkbtn" id="d_change">Cambiar</button></div>`:""}
    <button class="btn primary block" id="scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>Escanear QR</button>
    <button class="btn block" id="scanbar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5v14M7 5v14M10 5v14M14 5v14M16 5v14M20 5v14"/></svg>Código de barras</button>
    ${S.canWrite?'<button class="btn block" id="tonew"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>Nuevo producto</button>':''}
    <div class="search"><input id="q" type="search" inputmode="search" placeholder="Buscar en el almacén y el catálogo" value="${esc(S.q)}" autocomplete="off" aria-label="Buscar producto"></div>
    ${!S.loaded?'<div class="list"><div class="empty">Cargando inventario…</div></div>':
      !all.length?'<div class="list"><div class="empty">Aún no hay productos. Pulsa «Nuevo producto» para dar de alta el primero.</div></div>':
      q?(hits.length?`<div class="label">En el almacén · ${hits.length}</div><div class="list">${hits.map(productRow).join("")}</div>`
          :cat&&cat.n?`<div class="label">En el almacén no hay nada con «${esc(S.q)}»</div>`
          :bk?`<div class="label">Código de barras</div><div class="list"><div class="empty">El código de barras ${esc(S.q.trim())} aún no está en ningún producto.</div></div><button class="btn block" id="tobar">¿De qué producto es?</button>`
          :`<div class="label">0 resultados</div><div class="list"><div class="empty">Ningún producto coincide con «${esc(S.q)}».</div></div>`)+`
        ${catBlock(cat)}`:
      `<div class="label">Productos por estante · ${all.length}</div>
       <div class="groups">${[["@main"],...shelvesIn("main"),["@cb"],...shelvesIn("cb"),["@other"],["prestamos",LOAN_LOC],["none",NO_LOC]].map(([k,v],i,arr)=>{
         if(k[0]==="@"){ const next=arr.slice(i+1); const end=next.findIndex(([x])=>x[0]==="@"); const some=(end<0?next:next.slice(0,end)).some(([x])=>all.some(p=>locKey(p)===x)); return some&&k!=="@other"?`<div class="label roomlbl">${ROOMS[k.slice(1)]}</div>`:""; }
         const items=all.filter(p=>locKey(p)===k);
         if(!items.length) return "";
         return `<details class="group" data-g="${k}" ${S.openGroups.has(k)?"open":""}><summary><span class="dot" style="background:${v.color}"></span><span class="gname">${v.name}</span><span class="gcount">${items.length}</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg></summary><div class="list">${items.map(productRow).join("")}</div></details>`;
       }).join("")}</div>`}
    ${canRestricted()&&lowList().length?`<button class="alert" id="tolow">⚠ ${lowList().length} producto${lowList().length===1?"":"s"} por debajo del mínimo</button>`:""}
    ${myLoans().length?`<div><div class="label" style="margin-bottom:6px">Lo que tienes prestado</div><div class="list">${myLoans().map(l=>`<div class="loan"><span class="txt"><div class="name">${esc(l.producto)}</div><div class="sub">${since(l.salida)}</div></span><button class="btn" data-ret="${esc(l.id)}">Devolver</button></div>`).join("")}</div></div>`:""}
    <div class="links">
      <button class="btn" id="tomap">Mapa</button>
    </div>
    ${canRestricted()?`<button class="btn block" id="tohist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Acceso restringido</button>`:""}`;
  const qi=$("#q");
  qi.addEventListener("input",()=>{ S.q=qi.value; const pos=qi.selectionStart; viewSearch(); const n=$("#q"); n.focus(); try{n.setSelectionRange(pos,pos)}catch(e){} });
  qi.addEventListener("keydown",e=>{ if(e.key==="Enter"){ const p=S.products.get(normCode(qi.value))||(isBarText(qi.value)&&prodByBar(qi.value)); if(p) go("ficha",{code:p.codigo}); }});
  const tb=$("#tobar"); if(tb) tb.onclick=()=>openBar(S.q.trim());
  $("#scan").onclick=()=>{ S.scanFor=null; openScanner(); };
  $("#scanbar").onclick=()=>{ S.scanFor="bar"; openScanner(); };
  $("#tomap").onclick=()=>go("mapa",{mapSel:null});
  bindLoanButtons();
  const th=$("#tohist"); if(th) th.onclick=()=>{ S.adminWant=null; go("admin"); };
  const tl=$("#tolow"); if(tl) tl.onclick=()=>{ S.adminWant="ped"; if(S.adminOk) S.adminTab="ped"; go("admin"); };
  const dc=$("#d_change"); if(dc) dc.onclick=changeDest;
  const tn=$("#tonew"); if(tn) tn.onclick=()=>go("editar",{editCode:null});
  app.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>go("catitem",{catSku:b.dataset.cat}));
  app.querySelectorAll("details.group").forEach(d=>d.addEventListener("toggle",()=>{ d.open?S.openGroups.add(d.dataset.g):S.openGroups.delete(d.dataset.g); }));
}

function viewFicha(){
  const p = S.products.get(S.code);
  if(!p){
    const ci=S.loaded&&catByCode(S.code);
    if(ci){ go("catitem",{catSku:ci[0]}); return; }
    app.innerHTML=`<div class="empty">${S.loaded?`No existe ningún producto con el código <b>${esc(S.code)}</b>.`:"Cargando…"}</div><button class="btn block" id="b2">Ir al buscador</button>`; $("#b2").onclick=()=>go("buscar"); return; }
  const sh = locOf(p);
  const img = imgFor(p);
  const low = isLow(p);
  const allLoans = S.loans.filter(l=>l.codigo===p.codigo).sort((a,b)=>a.salida-b.salida);
  /* Who has what is only for Xavi (with the password); a technician only sees what they took. */
  const loans = S.adminOk ? allLoans : allLoans.filter(l=>S.tecnico&&l.tecnicoId===S.tecnico.id);
  let actions="";
  if(!S.canWrite) actions=`<p class="note">Tienes acceso de solo lectura: puedes consultar el stock pero no modificarlo.</p>`;
  else if(p.prestamo) actions=`<div class="stock">
      <span class="label">Préstamo</span>
      <span class="note">Para: <b>${esc(destLabel())}</b> · <button class="linkbtn" data-dchange>Cambiar</button></span>
      <div class="twobtn">
        <button class="btn out" id="lend" ${S.busy||p.cantidad<1?"disabled":""}>Llevar</button>
        <button class="btn in" id="giveback" ${S.busy||!allLoans.length?"disabled":""}>Devolver</button>
      </div>${p.cantidad<1?'<span class="note">No queda ninguna en el almacén.</span>':""}</div>`;
  else actions=`<div class="stock">
      <span class="label">Cantidad a mover</span>
      <span class="note">Para: <b>${esc(destLabel())}</b> · <button class="linkbtn" data-dchange>Cambiar</button></span>
      <div class="stepper">
        <button class="iconbtn" id="dec" aria-label="Menos"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path d="M5 12h14"/></svg></button>
        <input id="amt" type="number" inputmode="numeric" min="1" step="1" value="${S.amount}" aria-label="Cantidad a mover">
        <button class="iconbtn" id="inc" aria-label="Más"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path d="M5 12h14M12 5v14"/></svg></button>
      </div>
      <div class="twobtn">
        <button class="btn out" id="out" ${S.busy?"disabled":""}>− Sacar</button>
        <button class="btn in" id="in" ${S.busy?"disabled":""}>+ Añadir</button>
      </div></div>`;
  app.innerHTML = `<section class="ficha" style="display:flex;flex-direction:column;gap:14px">
    <div class="photo">${img?`<img src="${img}" alt="Foto de ${esc(p.nombre)}">`:esc(initials(p.nombre))}</div>
    <div><div class="code">${esc(p.codigo)}${p.prestamo?'<span class="pill">Préstamo</span>':''}</div><h2>${esc(p.nombre)}</h2></div>
    ${p.descripcion?`<p>${esc(p.descripcion)}</p>`:""}
    ${p.proveedor?`<p class="note" style="margin:0">Proveedor: <b>${esc(p.proveedor)}</b></p>`:""}
    ${barLine(p)}
    ${pricesHtml(catByCode(p.codigo))}${S.adminOk&&S.catVer&&!(S.cat&&S.cat.admin)?(ensureCat(),""):""}
    <div class="facts">
      <div class="fact"><span class="label">${p.prestamo?"Disponibles":"Cantidad"}</span><span class="big ${low?'qty low':''}">${p.cantidad}</span>${low?`<span class="chip" style="color:var(--danger)">Por debajo del mínimo (${Number(p.minimo)})</span>`:(p.prestamo&&S.adminOk&&loans.length?`<span class="chip">${loans.length} prestada${loans.length===1?"":"s"}</span>`:"")}</div>
      <div class="fact"><span class="label">Ubicación</span><button class="locbtn" id="loc"><span class="dot" style="background:${sh.color};width:14px;height:14px"></span>${esc(sh.name)}</button><span class="note">${nivLabel(p)?"<b>"+esc(nivLabel(p))+"</b> · ":""}${SHELVES[locKey(p)]?ROOMS[roomOf(locKey(p))]+" · ":""}Ver en el mapa</span></div>
    </div>
    ${rackBlock(p)}
    ${actions}
    ${p.prestamo&&S.adminOk&&loans.length?`<div><div class="label" style="margin-bottom:6px">Quién la tiene</div><div class="list">${loans.map(loanRow).join("")}</div></div>`:""}
    ${S.adminOk?`<div><div class="label" style="margin-bottom:6px">Últimos movimientos</div><div class="log" id="log"></div></div>`:""}
    ${S.canWrite&&!S.sheet?(p.prestamo&&!S.adminOk?`<button class="btn block" id="edit">Editar producto</button>`:`<div class="twobtn"><button class="btn" id="toggleLoan" ${S.busy?"disabled":""}>${p.prestamo?"Quitar de préstamos":"Llevar"}</button><button class="btn" id="edit">Editar producto</button></div>`):''}
  </section>`;
  renderLog();
  bindLoanButtons();
  bindBarLine(p);
  $("#loc").onclick=()=>go("mapa",{mapSel:locKey(p)});
  if(!S.canWrite) return;
  app.querySelectorAll("[data-dchange]").forEach(b=>b.onclick=changeDest);
  $("#edit").onclick=()=>go("editar",{editCode:p.codigo});
  const tl=$("#toggleLoan"); if(tl) tl.onclick=()=>p.prestamo?toggleLoan(p):takeNew(p);
  if(p.prestamo){
    const l=$("#lend"); if(l) l.onclick=()=>lend(p.codigo);
    /* Devolver: first what this technician took, otherwise the oldest one out (it records who brought it back). */
    const g=$("#giveback"); if(g) g.onclick=()=>{ const mine=allLoans.find(x=>S.tecnico&&x.tecnicoId===S.tecnico.id); const l2=mine||allLoans[0]; if(l2) returnLoan(l2); };
    return;
  }
  const amt=$("#amt");
  const getAmt=()=>Math.max(1,Math.floor(Number(amt.value)||1));
  amt.onchange=()=>{S.amount=getAmt(); amt.value=S.amount};
  $("#dec").onclick=()=>{S.amount=Math.max(1,getAmt()-1); amt.value=S.amount};
  $("#inc").onclick=()=>{S.amount=getAmt()+1; amt.value=S.amount};
  $("#out").onclick=()=>move(p.codigo,-getAmt());
  $("#in").onclick=()=>move(p.codigo,getAmt());
}

async function toggleLoan(p){
  if(S.busy) return;
  const on=!p.prestamo;
  if(!on&&S.loans.some(l=>l.codigo===p.codigo)){ toast("Antes de quitarlo de préstamos tienen que devolverlo."); return; }
  S.busy=true;
  try{
    await api("api_toggleLoan", S.tecnico.id, p.codigo, on);
    p.prestamo=on; refreshMoves();
    toast(on?`${p.nombre} está ahora en Préstamos.`:`${p.nombre} vuelve a ${(SHELVES[p.ubicacion]||NO_LOC).name.toLowerCase()}.`);
  }catch(err){ if(err&&err.code==="lent") toast("Antes de quitarlo de préstamos tienen que devolverlo."); else handleWriteError(err); }
  finally{ S.busy=false; if(S.view==="ficha") render(); }
}

/* «Llevar» on a normal product: it becomes a loan item and is lent to whoever pressed it. */
async function takeNew(p){
  if(S.busy||!S.tecnico) return;
  if(p.cantidad<1){ toast("No queda ninguna disponible."); return; }
  S.busy=true;
  try{ await api("api_toggleLoan", S.tecnico.id, p.codigo, true); p.prestamo=true; }
  catch(err){ S.busy=false; handleWriteError(err); if(S.view==="ficha") render(); return; }
  S.busy=false; await lend(p.codigo);
}

/* ---------- Destino: obligatorio tras elegir el nombre ---------- */
function destLabel(){ const d=S.destino; if(!d) return "—"; return d.tipo==="almacen"?"Almacén":`${d.comunidad} (${d.empresa})`; }
function destFields(){ const d=S.destino; if(!d) return {}; return d.tipo==="almacen"?{destino:"almacen",empresa:"",comunidad:"Almacén"}:{destino:"comunidad",empresa:d.empresa,comunidad:d.comunidad}; }
function changeDest(){ S.destStep="q1"; S.destNew=false; S.comunidad=""; go("destino"); }
function exactClient(){ const i=$("#pk_com"); if(!i||!S.empresa) return null; const q=fold(i.value); return q?S.clientes.find(c=>fold(c.nombre)===q&&(!c.empresa||c.empresa===S.empresa))||null:null; }
function finishDest(d){
  S.destino=d; S.destStep="q1"; S.destNew=false;
  const c=S.pending; S.pending=null;
  if(c&&S.products.has(c)) go("ficha",{code:c}); else go("buscar");
  toast(`Para: ${destLabel()}`);
}
function viewDest(){
  const st=S.destStep||"q1";
  const yesNo=`<div class="seg"><button class="btn primary bigyes" id="d_si">Sí</button><button class="btn bigyes" id="d_no">No</button></div>`;
  app.innerHTML = `<section class="login">
    ${st==="q1"?`<h2>¿Es para una comunidad?</h2>${yesNo}`:
      st==="alm"?`<h2>¿Es para almacén?</h2>${yesNo}`:
      `<h2>¿Para qué comunidad?</h2>${pickerHtml("Comunidad o cliente")}
       <button class="btn primary block" id="d_ok" disabled>Continuar</button>
       <button class="linkbtn" id="d_back">Atrás</button>`}
    ${S.pending?`<p class="note">Después se abrirá el producto <b>${esc(S.pending)}</b>.</p>`:""}
  </section>`;
  if(st==="q1"){ $("#d_si").onclick=()=>{ S.destStep="com"; viewDest(); setTimeout(()=>{const i=$("#pk_com"); if(i) i.focus();},50); }; $("#d_no").onclick=()=>{ S.destStep="alm"; viewDest(); }; return; }
  if(st==="alm"){ $("#d_si").onclick=()=>finishDest({tipo:"almacen"}); $("#d_no").onclick=()=>{ S.destStep="q1"; viewDest(); }; return; }
  bindPicker();
  $("#d_back").onclick=()=>{ S.destStep="q1"; viewDest(); };
  $("#d_ok").onclick=()=>{
    const typed=($("#pk_com").value||"").trim(), ex=exactClient();
    if(!S.empresa){ toast("Elige la empresa: Marcres o Rivagua."); return; }
    if(!ex&&!(S.destNew&&typed)){ toast("Elige la comunidad de la lista."); return; }
    if(!ex) rememberClient(S.empresa,typed);
    finishDest({tipo:"comunidad",empresa:S.empresa,comunidad:ex?ex.nombre:typed});
  };
}
function updateDestOk(){ const b=$("#d_ok"); if(!b) return; const typed=($("#pk_com")?.value||"").trim(); b.disabled=!(S.empresa&&(exactClient()||(S.destNew&&typed))); }

/* Empresa + comunidad picker used by the destination step. */
function pickerHtml(label){
  return `<div><span class="label">Empresa</span><div class="seg" style="margin-top:4px">${EMPRESAS.map(e=>`<button type="button" class="btn" data-emp="${e}" aria-pressed="${S.empresa===e}">${e}</button>`).join("")}</div></div>
    <label class="field"><span class="label">${label}</span><input id="pk_com" autocomplete="off" placeholder="Escribe para buscar" value="${esc(S.comunidad)}"></label>
    <div id="pk_sug"></div>`;
}
function bindPicker(){
  app.querySelectorAll("[data-emp]").forEach(b=>b.onclick=()=>{ S.empresa=b.dataset.emp; S.destNew=false; app.querySelectorAll("[data-emp]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.emp===S.empresa)); drawSug(); });
  const i=$("#pk_com"); i.oninput=()=>{ S.comunidad=i.value; S.destNew=false; drawSug(); };
  drawSug();
}
function drawSug(){
  const box=$("#pk_sug"), i=$("#pk_com"); if(!box||!i) return;
  const q=fold(i.value); updateDestOk();
  if(!S.empresa){ box.innerHTML=q?'<p class="note">Primero elige Marcres o Rivagua.</p>':""; return; }
  if(q.length<2){ box.innerHTML=""; return; }
  const parts=q.split(/\s+/);
  const seen=new Set();
  const hits=S.clientes.filter(c=>(!S.empresa||!c.empresa||c.empresa===S.empresa)&&parts.every(w=>fold(c.nombre).includes(w)))
    .filter(c=>{ const k=fold(c.nombre); if(seen.has(k)) return false; seen.add(k); return true; })
    .sort((a,b)=>a.nombre.localeCompare(b.nombre,"es")).slice(0,5);
  if(hits.some(c=>fold(c.nombre)===q)&&hits.length===1){ box.innerHTML=""; return; }
  box.innerHTML = (hits.length?`<div class="sug">${hits.map(c=>`<button type="button" data-cli="${esc(c.nombre)}">${esc(c.nombre)}</button>`).join("")}</div>`:`<p class="note">No está en la lista de ${esc(S.empresa)}.</p>`)
    + (hits.length?"":S.destNew?`<p class="note">Se añadirá «${esc(i.value.trim())}» como nueva.</p>`:`<button type="button" class="linkbtn" id="pk_new">Es nueva: añadir «${esc(i.value.trim())}»</button>`);
  box.querySelectorAll("[data-cli]").forEach(b=>b.onclick=()=>{ i.value=b.dataset.cli; S.comunidad=i.value; S.destNew=false; box.innerHTML=""; updateDestOk(); });
  const nb=$("#pk_new"); if(nb) nb.onclick=()=>{ S.destNew=true; drawSug(); };
}
function rememberClient(empresa,nombre){
  const k=fold(nombre); if(!k||S.clientes.some(c=>fold(c.nombre)===k&&(!c.empresa||c.empresa===empresa))) return;
  S.appClients.push({nombre,empresa}); S.clientes.push({nombre,empresa});
  if(S.tecnico) api("api_addClient", S.tecnico.id, nombre, empresa).catch(()=>{});
}

/* ---------- Préstamos ---------- */
const since = t => { const d=Math.floor((Date.now()-t)/86400000); return d<=0?"hoy":d===1?"desde ayer":`hace ${d} días`; };
function loanRow(l){
  return `<div class="loan"><span class="txt"><div class="name">${esc(l.tecnico)}</div>
    <div class="sub">${esc([l.empresa,l.comunidad].filter(Boolean).join(" · ")||"Sin comunidad")} · ${since(l.salida)} (${fmtDate(l.salida)})</div></span>
    ${S.canWrite?`<button class="btn" data-ret="${esc(l.id)}">Devolver</button>`:""}</div>`;
}
const myLoans = () => S.tecnico ? S.loans.filter(l=>l.tecnicoId===S.tecnico.id).sort((a,b)=>a.salida-b.salida) : [];
function bindLoanButtons(){
  app.querySelectorAll("[data-ret]").forEach(b=>b.onclick=()=>{ const l=S.loans.find(x=>x.id===b.dataset.ret); if(l) returnLoan(l); });
}
function viewLoans(){
  const box=$("#adm"); if(!box||!S.adminOk) return;
  const open=[...S.loans].sort((a,b)=>a.salida-b.salida);
  const tools=[...S.products.values()].filter(p=>p.prestamo).sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));
  box.innerHTML = `
    <div class="label">Prestadas ahora · ${open.length}</div>
    <div class="list">${open.length?open.map(l=>`<div class="loan"><span class="txt"><div class="name">${esc(l.producto)} <span class="code">${esc(l.codigo)}</span></div>
      <div class="sub"><b style="color:var(--fg)">${esc(l.tecnico)}</b> · ${esc([l.empresa,l.comunidad].filter(Boolean).join(" · ")||"Sin comunidad")} · ${since(l.salida)}</div></span>
      ${S.canWrite?`<button class="btn" data-ret="${esc(l.id)}">Devolver</button>`:""}</div>`).join(""):'<div class="empty">Ahora mismo no hay nada prestado.</div>'}</div>
    <div class="label">Herramientas y maquinaria · ${tools.length}</div>
    <div class="list">${tools.length?tools.map(productRow).join(""):'<div class="empty">Ningún producto está marcado como préstamo. Márcalo en «Editar producto».</div>'}</div>`;
  bindLoanButtons();
}
async function lend(code){
  const p=S.products.get(code); if(!p||S.busy||!S.tecnico) return;
  S.busy=true; viewFicha();
  try{
    const r=await api("api_lend", S.tecnico.id, code, S.destino);
    p.cantidad=r.next; remember("qty",code,r.next); remember("added",r.loan.id,r.loan);
    S.loans=[...S.loans.filter(l=>l.id!==r.loan.id), r.loan]; saveCache({loans:S.loans});
    toast(`Apuntado: te llevas ${p.nombre}.`); refreshMoves();
  }catch(err){
    if(err&&err.code==="gone") toast("Este producto ya no existe.");
    else if(err&&err.code==="none") toast("No queda ninguna disponible.");
    else handleWriteError(err);
  }
  finally{ S.busy=false; if(S.view==="ficha") render(); }
}
async function returnLoan(l){
  if(S.busy||!S.tecnico) return;
  S.busy=true;
  try{
    const r=await api("api_return", S.tecnico.id, l.id);
    remember("gone",l.id,true); S.loans=S.loans.filter(x=>x.id!==l.id); saveCache({loans:S.loans});
    const p=S.products.get(l.codigo); if(p&&!r.gone){ p.cantidad=r.next; remember("qty",l.codigo,r.next); }
    toast(`${l.producto} devuelto.`); refreshMoves();
  }catch(err){
    if(err&&err.code==="done"){ remember("gone",l.id,true); S.loans=S.loans.filter(x=>x.id!==l.id); saveCache({loans:S.loans}); toast("Este préstamo ya estaba devuelto."); }
    else handleWriteError(err);
  }
  finally{ S.busy=false; if(S.view==="ficha"||S.view==="admin"||S.view==="buscar") render(); }
}

function renderLog(){
  const el=$("#log"); if(!el) return;
  if(!S.moves.length){ el.innerHTML='<span class="note">Sin movimientos registrados todavía.</span>'; return; }
  el.innerHTML = S.moves.map(m=>{
    const d=Number(m.delta)||0;
    const amount = (m.tipo!=="edicion"&&m.tipo!=="baja") ? `<span class="d ${d<0?'neg':'pos'}">${d>0?"+":""}${d} → ${m.despues}</span>` : `<span class="d">${esc(TIPOS[m.tipo]||m.tipo||"")}</span>`;
    return `<div><span>${fmtDate(m.fecha)} · ${esc(m.tecnico||"—")}${m.comunidad?` · ${esc(m.comunidad)}`:""}</span>${amount}</div>`;
  }).join("");
}

/* Cuarto blanco, tal como lo dibujó Xavi: puerta abajo a la derecha, junto a la mesa. */
function cbSvg(sel){

/* ---------- Altura en el estante (arriba, en medio, abajo) con un dibujo en 3D del estante ---------- */
/* Each shelf has its own number of levels (3 unless Xavi sets another in the map). Level 1 is the bottom one. */
const NIV_OLD={abajo:1,medio:2,arriba:3};
const nBaldas = k => Math.min(8,Math.max(2,Number(S.baldas[k])||3));
const LADOS={izq:"Izquierda",centro:"Centro",der:"Derecha"};
const ladoOf = p => p&&LADOS[S.lados[p.codigo]]?S.lados[p.codigo]:"";
function nivName(i,n){
  if(i===1) return "Abajo"; if(i===n) return "Arriba";
  if(n===3) return "En medio"; if(n===4) return i===2?"Medio bajo":"Medio alto";
  return "Balda "+i;
}
function nivOf(p){
  if(!p) return 0; const v=S.niv[p.codigo]; const i=NIV_OLD[v]||Number(v)||0;
  return i>=1?Math.min(i,nBaldas(locKey(p))):0;
}
function nivLabel(p){ const i=nivOf(p), l=ladoOf(p); return [i?nivName(i,nBaldas(locKey(p))):"", l?LADOS[l]:""].filter(Boolean).join(", "); }
function nivOptions(shelf, cur){
  const n=nBaldas(shelf); let o=`<option value="">Sin indicar</option>`;
  for(let i=n;i>=1;i--) o+=`<option value="${i}" ${cur===i?"selected":""}>${nivName(i,n)} (balda ${i} de ${n})</option>`;
  return o;
}
function rack3d(color, level, n, lado){
  n=n||3;
  const X0=30, X1=150, DX=46, DY=-28, TOP=28, BOT=TOP+Math.max(168,n*42);
  const Y=[...Array(n+1)].map((_,i)=>BOT-(BOT-TOP)*i/n);   // floor … top
  const idx=level?level-1:-1;
  const plane=(y,fill,op)=>`<polygon points="${X0},${y} ${X1},${y} ${X1+DX},${y+DY} ${X0+DX},${y+DY}" style="fill:${fill};fill-opacity:${op};stroke:var(--fg);stroke-width:2;stroke-linejoin:round"/>`;
  let g=`<line x1="${X0+DX}" y1="${TOP+DY}" x2="${X0+DX}" y2="${BOT+DY}" style="stroke:var(--muted);stroke-width:2"/><line x1="${X1+DX}" y1="${TOP+DY}" x2="${X1+DX}" y2="${BOT+DY}" style="stroke:var(--fg);stroke-width:3"/>`;
  if(idx>=0){ const yb=Y[idx], yt=Y[idx+1]; g+=`<polygon points="${X0+DX},${yt+DY} ${X1+DX},${yt+DY} ${X1+DX},${yb+DY} ${X0+DX},${yb+DY}" style="fill:${color};fill-opacity:.35"/>`; }
  Y.forEach((y,i)=>{ g+=plane(y, i===idx?color:"var(--surface)", i===idx?1:.9); });
  if(idx>=0){
    const yb=Y[idx], gap=(BOT-TOP)/n, h=Math.min(30,gap-18), w=34, d=14, dy=-9;
    const cx={izq:X0+6,der:X1-w-2,centro:X0+DX/2+40}[lado]||X0+DX/2+38;
    g+=`<g style="stroke:var(--fg);stroke-width:2;stroke-linejoin:round">
      <polygon points="${cx},${yb-6} ${cx+w},${yb-6} ${cx+w},${yb-6-h} ${cx},${yb-6-h}" style="fill:#e8c48a"/>
      <polygon points="${cx},${yb-6-h} ${cx+w},${yb-6-h} ${cx+w+d},${yb-6-h+dy} ${cx+d},${yb-6-h+dy}" style="fill:#f3d9ad"/>
      <polygon points="${cx+w},${yb-6} ${cx+w+d},${yb-6+dy} ${cx+w+d},${yb-6-h+dy} ${cx+w},${yb-6-h}" style="fill:#c99d5c"/></g>`;
  }
  g+=`<line x1="${X0}" y1="${TOP}" x2="${X0}" y2="${BOT}" style="stroke:var(--fg);stroke-width:3"/><line x1="${X1}" y1="${TOP}" x2="${X1}" y2="${BOT}" style="stroke:var(--fg);stroke-width:3"/>`;
  for(let i=0;i<n;i++){ const y=(Y[i]+Y[i+1])/2+DY/2+5, on=i===idx;
    g+=`<text x="${X1+DX+10}" y="${y}" style="font:${on?800:600} ${on?15:13}px var(--f-display),sans-serif;fill:${on?"var(--fg)":"var(--muted)"}">${on?"◀ ":""}${nivName(i+1,n)}</text>`; }
  if(idx>=0&&lado){ g+=`<text x="${X0+(X1-X0)/2}" y="${BOT+18}" text-anchor="middle" style="font:800 14px var(--f-display),sans-serif;fill:var(--fg)">${{izq:"◀ Izquierda",centro:"Centro",der:"Derecha ▶"}[lado]}</text>`; }
  return `<svg viewBox="0 0 300 ${BOT+(lado?26:14)}" width="100%" style="max-width:340px;display:block;margin:0 auto" role="img" aria-label="Estante en 3D de ${n} baldas${idx>=0?": "+nivName(idx+1,n):""}${lado?", "+LADOS[lado]:""}">${g}</svg>`;
}
function rackBlock(p){
  const i=nivOf(p), l=ladoOf(p); if(!(i||l)||locKey(p)==="none"||locKey(p)==="prestamos") return "";
  const k=locKey(p), sh=locOf(p), n=nBaldas(k);
  return `<div class="rack"><div class="label">Dónde está en el estante</div>${rack3d(sh.color,i,n,l)}<p class="note" style="margin:0;text-align:center">${esc(sh.name)} · <b>${esc(nivLabel(p))}</b>${i?` (balda ${i} de ${n})`:""}</p></div>`;
}
/* Map: drawing of the selected shelf, and for Xavi (with the password) how many levels it has. */
function shelfRack(sel){
  if(!SHELVES[sel]) return "";

    ${S.adminOk?`<div class="note" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">Baldas de este estante: ${[2,3,4,5,6,7,8].map(k=>`<button class="btn" data-baldas="${k}" aria-pressed="${k===n}" style="min-width:44px;padding:6px 10px${k===n?";background:var(--brand);color:var(--brand-fg)":""}">${k}</button>`).join("")}</div>`:""}</div>`;
}

function viewMap(){

    catch(err){ if(old) S.baldas[k]=old; else delete S.baldas[k]; if(S.view==="mapa") viewMap(); if(oldServer(err)) toast("Hay que pegar servidor.gs en Apps Script."); else adminError(err); }
  });
}

/* ---------- Catálogo: todo lo que se vende o se usa, esté o no en el almacén ----------

const CAT_KEY="almacen_cat_v1", CAT_MAX=40;
const qWords = q => fold(q).split(/\s+/).filter(Boolean);
const hasWords = (txt, words) => { const t=fold(txt); return words.every(w=>t.includes(w)); };
const catCode = sku => normCode(String(sku||"").replace(/^SKU_/i,""));
function catLoad(){ try{ const c=JSON.parse(localStorage.getItem(CAT_KEY)||"null"); if(c&&Array.isArray(c.items)) S.cat={...c,admin:false}; }catch(e){} }
function catSave(c){ try{ localStorage.setItem(CAT_KEY, JSON.stringify({ver:c.ver, items:c.items.map(r=>r.slice(0,4))})); }catch(e){} }
function catIndex(){
  if(!S.cat) return null;
  if(!S.cat.byCode){ S.cat.byCode=new Map(); S.cat.items.forEach(r=>S.cat.byCode.set(catCode(r[0]),r)); S.cat.text=S.cat.items.map(r=>fold(catCode(r[0])+" "+r[1]+" "+r[2]+" "+r[3])); }

}
function catByCode(code){ const c=catIndex(); return c?c.byCode.get(normCode(code))||null:null; }
async function ensureCat(){
  if(S.catLoading||S.catVer===""||Date.now()-(S.catFailAt||0)<30000) return;
  const want=S.adminOk&&S.adminToken;
  if(S.cat&&S.catVer!==null&&S.cat.ver===S.catVer&&(!want||S.cat.admin)) return;
  if(S.cat&&S.catVer===null&&!want) return;

    const r=await api("api_catalog", want?S.adminToken:null);

function catHits(words){

const material = s => String(s||"").replace(/#/g," ").replace(/\s+/g," ").trim().toLowerCase().replace(/^./,c=>c.toUpperCase());

/* Excel de Holded → filas [sku, nombre, descripción, material, precio compra, PVP sin IVA]. */
function loadScript(urls){
  return urls.reduce((p,u)=>p.catch(()=>new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src=u; sc.onload=res; sc.onerror=()=>{ sc.remove(); rej(); }; document.head.appendChild(sc); })), Promise.reject());
}
async function readHolded(file){
  if(!window.XLSX) await loadScript(["https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js","https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"]);
  const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:""});
  const key=v=>fold(String(v));
  const hi=rows.findIndex(r=>r.some(v=>key(v)==="sku")&&r.some(v=>key(v)==="nombre"));
  if(hi<0) throw new Error("cols");
  const h=rows[hi].map(key), col=(...names)=>{ for(const n of names){ const i=h.indexOf(n); if(i>=0) return i; } return -1; };
  const iS=col("sku"), iN=col("nombre"), iD=col("descripcion"), iT=col("tags","material"), iC=col("precio compra","coste"), iP=col("subtotal","pvp sin iva","precio","precio venta");
  const num=v=>typeof v==="number"?v:Number(String(v).replace(/\./g,"").replace(",","."))||0;
  const get=(r,i)=>i<0?"":String(r[i]??"").replace(/\s+/g," ").trim();
  return rows.slice(hi+1).map(r=>[get(r,iS), get(r,iN), get(r,iD), get(r,iT), iC<0?0:num(r[iC]), iP<0?0:num(r[iP])]).filter(r=>r[0]&&r[1]);
}
function viewCatAdmin(){

    <p class="note" style="margin:0">Exporta los productos desde Holded a Excel y cárgalo aquí. Sustituye el catálogo entero, así que sirve también para ponerlo al día. Los técnicos lo ven al buscar, sin precios; los precios solo los ves tú.</p>

    try{
      const r=await api("api_catalogImport", S.adminToken, imp.rows);
      S.catImp=null; S.catVer=r.ver; S.cat=null; toast(`Catálogo cargado: ${r.n.toLocaleString("es-ES")} productos`);

}

/* ---------- IA (solo Xavi): foto de placa. Gemini de Google AI Studio lee la placa de características ---------- */
const PLATE_FIELDS=[["marca","Marca"],["modelo","Modelo"],["tipo","Tipo"],["referencia","Referencia"],["numero_serie","Nº de serie"],["potencia","Potencia"],["tension","Tensión"],["intensidad","Intensidad"],["frecuencia","Frecuencia"],["caudal","Caudal"],["altura","Altura"],["otros","Otros"]];
function plateMatches(d){
  /* Whole pieces, so "MULTI 35 5N" finds "MULTI 35 5 N" but not "MULTI 35 4" or "MULTI 30 5". */
  const split=t=>fold(t).split(/[^a-z0-9]+|(?<=\d)(?=[a-z])|(?<=[a-z])(?=\d)/).filter(w=>w&&(w.length>1||/\d/.test(w)));
  const fits=(txt,words)=>{ const toks=split(txt); return words.every(w=>toks.some(t=>/\d/.test(w)?t===w:t.startsWith(w))); };
  const tries=[[d.marca,d.modelo],[d.modelo],[d.referencia]].map(t=>split(t.filter(Boolean).join(" "))).filter(w=>w.length);
  const c=catIndex();
  for(const words of tries){
    const inv=[...S.products.values()].filter(p=>fits(p.codigo+" "+p.nombre+" "+(p.descripcion||""),words)).slice(0,5);
    const cat=c?c.items.filter(r=>!S.products.has(catCode(r[0]))&&fits(r[1]+" "+r[2]+" "+catCode(r[0]),words)).slice(0,5):[];
    if(inv.length||cat.length) return {inv, cat};
  }
  return {inv:[], cat:[]};
}
function plateDesc(d){ return PLATE_FIELDS.filter(([k])=>k!=="tipo"&&String(d[k]||"").trim()).map(([k,l])=>`${l}: ${String(d[k]).trim()}`).join(" · "); }
const PLATE_ERR={
  nokey:`Falta la clave de Google AI Studio. Una sola vez:<br>1. Entra en <b>aistudio.google.com</b> con tu cuenta de Google y pulsa «Get API key» → «Create API key». Cópiala.<br>2. En Apps Script: ⚙️ Configuración del proyecto → Propiedades de la secuencia de comandos → Añadir: nombre <b>GEMINI_KEY</b>, valor la clave. Guardar.<br>3. En el editor, elige la función <b>probarGemini</b> y pulsa Ejecutar; acepta el permiso.<br>La clave no la escribas nunca en el chat.`,
  badkey:"Google no acepta la clave. Revisa GEMINI_KEY en las propiedades de Apps Script.",
  quota:"Se ha pasado el uso gratuito de hoy de Google AI Studio. Prueba mañana o activa la facturación en AI Studio.",
  model:"El modelo de Gemini configurado ya no existe. Borra la propiedad GEMINI_MODEL en Apps Script.",
  old:"Falta pegar el api.gs nuevo en Apps Script y hacer Nueva versión.",
  get network(){ return netMsg(); },
};
function viewPlate(){
  const box=$("#adm"), P=S.plate||{};
  const d=P.data, m=d&&d.legible!==false?plateMatches(d):null;
  box.innerHTML=`<div style="display:flex;flex-direction:column;gap:12px;margin-top:12px">
    <p class="note" style="margin:0"><b>Foto de placa.</b> Haz una foto a la placa de características de una bomba, motor o cuadro y la IA (Gemini) la lee y te rellena el producto. Solo lo ves tú.</p>
    <button class="btn primary block" id="pl_shot" ${P.busy?"disabled":""}>${P.busy?"Leyendo la placa…":d||P.err?"Hacer otra foto":"Hacer foto de la placa"}</button>
    ${P.img?`<img src="${P.img}" alt="Foto de la placa" style="width:100%;max-height:260px;object-fit:contain;border-radius:8px;background:var(--surface-2)">`:""}
    ${P.err?`<p class="catnote" style="margin:0;font-weight:400">${PLATE_ERR[P.err]||"Google no ha podido leer la placa"+(P.msg?` (${esc(P.msg)})`:"")+". Inténtalo de nuevo."}</p>`:""}
    ${d&&d.legible===false?`<p class="catnote" style="margin:0">No se lee bien la placa. Haz otra foto más cerca, recta y con luz.</p>`:""}
    ${d&&d.legible!==false?`
      <div><div class="label" style="margin-bottom:6px">Lo que pone la placa</div>
        <h2 style="margin:0 0 6px">${esc(d.nombre||[d.tipo,d.marca,d.modelo].filter(Boolean).join(" ")||"Sin nombre")}</h2>
        <div class="list">${PLATE_FIELDS.filter(([k])=>String(d[k]||"").trim()).map(([k,l])=>`<div class="row" style="cursor:default"><span class="txt"><div class="code">${l}</div><div class="name" style="font-weight:600">${esc(d[k])}</div></span></div>`).join("")||'<div class="empty">No ha encontrado datos.</div>'}</div></div>
      <p class="note" style="margin:0">Revísalo: la IA puede equivocarse con una letra o un número.</p>
      ${m.inv.length?`<div><div class="label" style="margin-bottom:6px">Ya está en el almacén</div><div class="list">${m.inv.map(productRow).join("")}</div></div>`:""}
      ${m.cat.length?`<div><div class="label" style="margin-bottom:6px">En el catálogo</div><div class="list">${m.cat.map(r=>`<button class="row catrow" data-cat="${esc(r[0])}"><span class="thumb">${esc(initials(r[1]))}</span><span class="txt"><div class="name">${esc(r[1])}</div><div class="code">${esc(catCode(r[0]))}</div></span><span class="pill">Catálogo</span></button>`).join("")}</div></div>`:""}
      <button class="btn block" id="pl_new">Dar de alta con estos datos</button>`:""}
  </div>`;
  const shot=$("#pl_shot");
  shot.onclick=()=>{ const inp=$("#photofile"); inp.value=""; inp.onchange=async()=>{
    const file=inp.files[0]; if(!file) return;
    S.plate={busy:true}; viewPlate();
    try{
      const blob=await shrink(file,1600), b64=await blobToBase64(blob);
      S.plate.img="data:image/jpeg;base64,"+b64; viewPlate();
      const r=await api("api_plate", S.adminToken, b64);
      S.plate={img:S.plate.img, data:r.data||{}};
    }catch(err){
      const c=err&&err.code;
      if(c==="auth"){ S.adminOk=false; S.plate=null; toast("Vuelve a poner la contraseña."); go("admin"); return; }
      S.plate={img:S.plate&&S.plate.img, err:err&&err.msg==="función desconocida"?"old":c, msg:err&&err.msg};
    }
    if(S.view==="admin"&&S.adminTab==="plate") viewPlate();
  }; inp.click(); };
  box.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>go("ficha",{code:b.dataset.open}));
  box.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>go("catitem",{catSku:b.dataset.cat}));
  const nw=$("#pl_new");
  if(nw) nw.onclick=()=>go("editar",{editCode:null, prefill:{nombre:String(d.nombre||[d.tipo,d.marca,d.modelo].filter(Boolean).join(" ")).toUpperCase(), descripcion:plateDesc(d), note:"Datos leídos de la placa. Revísalos, elige estante y cantidad y pulsa Guardar."}});
  if(S.catVer&&!S.cat) ensureCat();
}

/* ---------- Códigos de barras del fabricante ----------
 * Cada producto puede tener uno o varios (pestaña «Barras» de la hoja). Al escanear uno se abre su ficha;
 * si no está en la app, se asigna a un producto del almacén o se da de alta uno nuevo. Sin IA. */
const barKey = s => { s=String(s??"").trim().toUpperCase().replace(/\s+/g,""); return /^\d+$/.test(s)?(s.replace(/^0+/,"")||"0"):s.replace(/[^A-Z0-9._\/+-]/g,""); };
const isBarText = t => /^\d{6,14}$/.test(String(t||"").trim());
function barsOf(code){ const out=[]; for(const [k,c] of S.bars) if(c===code) out.push(k); return out; }
function prodByBar(t){ const c=S.bars.get(barKey(t)); return c&&S.products.get(c)||null; }
const oldServer = err => err&&err.code==="bad"&&/desconocida/.test(err.msg||"");
function openBar(raw){ S.barPick=null; S.barQ=""; S.web=null; go("barra",{bar:String(raw||"").trim()}); }
async function linkBar(raw, code){
  const p=S.products.get(code); if(!p||!S.tecnico) return false;
  try{
    const r=await api("api_setBarcode", S.tecnico.id, raw, code);
    S.bars.set(r&&r.bar||barKey(raw), code);
    toast(`Código de barras guardado en ${p.nombre}.`);
    if(S.view==="ficha"&&S.code===code) render();
    return true;
  }catch(err){
    if(err&&err.code==="taken"){ const o=S.products.get(err.codigo); toast(`Ese código de barras ya es de ${o?o.nombre:err.codigo}.`); }
    else if(oldServer(err)) toast("Para guardar códigos de barras hay que pegar el api.gs nuevo en Apps Script.");
    else handleWriteError(err);
    return false;
  }
}
async function unlinkBar(k, code){
  try{ await api("api_setBarcode", S.tecnico.id, k, ""); if(S.bars.get(k)===code) S.bars.delete(k); toast("Código de barras quitado."); render(); }
  catch(err){ handleWriteError(err); }
}
function barLine(p){
  const bars=barsOf(p.codigo);
  if(!bars.length) return S.canWrite?`<button class="linkbtn" id="addbar" style="align-self:flex-start;padding:0">+ Añadir el código de barras del fabricante</button>`:"";
  return `<p class="note" style="margin:0">Código de barras: ${bars.map(k=>`<b style="font-family:var(--f-mono)">${esc(k)}</b>${S.adminOk?` <button class="linkbtn" data-unbar="${esc(k)}" aria-label="Quitar ${esc(k)}" style="padding:0 4px">quitar</button>`:""}`).join(", ")}${S.canWrite?` · <button class="linkbtn" id="addbar" style="padding:0">Añadir otro</button>`:""}</p>`;
}
function bindBarLine(p){
  const a=$("#addbar"); if(a) a.onclick=()=>{ S.scanFor="link"; S.linkCode=p.codigo; openScanner(); };
  app.querySelectorAll("[data-unbar]").forEach(b=>b.onclick=()=>unlinkBar(b.dataset.unbar,p.codigo));
}
function viewBar(){
  const raw=S.bar, known=prodByBar(raw);
  if(known){ go("ficha",{code:known.codigo}); return; }
  const words=qWords(S.barQ||"");

  const pick=S.barPick&&S.products.get(S.barPick);
