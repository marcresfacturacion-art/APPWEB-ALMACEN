  app.innerHTML=`<section style="display:flex;flex-direction:column;gap:12px">
    <div><div class="label">Código de barras</div><h2 style="font-family:var(--f-mono);margin:4px 0 0">${esc(raw)}</h2></div>
    <p class="catnote" style="margin:0">Aún no está en ningún producto de la app.</p>
    ${canRestricted()?`<div class="stock" id="b_web"><span class="label">Búsqueda en internet: Google y, si no, la IA</span>${webBlock(S.web&&S.web.raw===raw?S.web:null,"Dar de alta con este nombre")}
      ${S.web&&S.web.raw===raw&&!S.web.busy?`<span class="note"><button class="linkbtn" id="b_again" style="padding:0">Buscar otra vez</button> · <a href="${esc(gq)}" target="_blank" rel="noopener">Abrir en Google</a></span>`:""}</div>`:""}
    ${S.canWrite?`<div class="label" style="margin-top:6px">Búsqueda en el almacén: ¿de qué producto es?</div>
    <div class="search"><input id="b_q" type="search" placeholder="Busca el producto por nombre" value="${esc(S.barQ||"")}" autocomplete="off" aria-label="Buscar el producto"></div>
    ${pick?`<div class="stock"><span>¿Guardar el código <b>${esc(raw)}</b> en <b>${esc(pick.nombre)}</b>?</span><div class="twobtn"><button class="btn" id="b_no">Cancelar</button><button class="btn primary" id="b_yes">Guardar</button></div></div>`:""}
    ${words.length?(hits.length?`<div class="list">${hits.map(p=>productRow(p).replace('data-open=','data-pick=')).join("")}</div>`:`<div class="list"><div class="empty">Ningún producto coincide.</div></div>`):""}
    <button class="btn block" id="b_new">No está: es un producto nuevo</button>`:`<p class="note">Tienes acceso de solo lectura.</p>`}
  </section>`;
  const ag=$("#b_again"); if(ag) ag.onclick=()=>webSearch(raw,true);
  const bw=$("#b_web"); if(bw) bindWeb(bw, raw, (n,desc)=>go("editar",{editCode:null, prefill:{bar:raw, web:true, nombre:n, descripcion:desc, note:`Rellenado desde internet (código de barras ${raw}). Revísalo, elige estante y cantidad y pulsa Guardar.`}}));
  const qi=$("#b_q");
  if(qi) qi.addEventListener("input",()=>{ S.barQ=qi.value; S.barPick=null; const pos=qi.selectionStart; viewBar(); const n=$("#b_q"); n.focus(); try{n.setSelectionRange(pos,pos)}catch(e){} });
  app.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{ S.barPick=b.dataset.pick; viewBar(); window.scrollTo(0,0); });
  const no=$("#b_no"); if(no) no.onclick=()=>{ S.barPick=null; viewBar(); };
  const yes=$("#b_yes"); if(yes) yes.onclick=async()=>{ yes.disabled=true; const code=S.barPick; if(await linkBar(raw,code)) go("ficha",{code}); else { yes.disabled=false; } };
  const nw=$("#b_new"); if(nw) nw.onclick=()=>go("editar",{editCode:null, prefill:{bar:raw, note:`Código de barras ${raw}. Escribe el nombre, elige estante y cantidad y pulsa Guardar.`}});
  if(!S.web||S.web.raw!==raw) webSearch(raw);
}

/* Búsqueda en internet por código de barras, solo para Xavi (basta con entrar con su nombre).
   Por pasos: 1) el código en la app, 2) Google (con otros buscadores de apoyo), 3) la IA, solo si Google no lo encuentra. */
function webErr(err){ return oldServer(err)?"Para buscar en internet hay que pegar servidor.gs en Apps Script.":/permis/i.test(err.msg||"")?"Falta el permiso de Google para salir a internet: en Apps Script ejecuta una vez probarGemini y acepta.":err.code==="network"?netMsg():"No se pudo buscar ("+(err.msg||err.code)+")."; }
function iaErr(err){ const c=err&&err.code; return c==="nokey"?"La IA no tiene clave: pon GEMINI_KEY en Apps Script, como para la foto de placa.":c==="quota"?PLATE_ERR.quota:c==="badkey"?PLATE_ERR.badkey:webErr(err); }
const hostOf=u=>(/^https?:\/\/([^/]+)/.exec(u||"")||[])[1]||"";
function webRedraw(){ if(S.view==="barra"){ if(!typing()) viewBar(); } else if(S.view==="editar") drawEditWeb(); }
function webBlock(w, label){
  if(!w||w.busy) return `<span class="note">Buscando en Google…</span>`;
  if(w.net) return `<span class="note">${esc(w.err)}</span>${navigator.onLine!==false?`<a class="btn block" href="arreglar.html">Arreglar el servidor</a>`:""}`;
  let h=w.err?`<span class="note">${esc(w.err)}</span>`:!w.items.length?`<span class="note">Google no encuentra nada con este código.</span>`:webList(w.items,false,label);
  const ia=w.ia, has=w.items.some(x=>x.ean!==false);
  let i="";
  if(!ia) i=`<button type="button" class="linkbtn" data-askia style="padding:0;align-self:flex-start">${has?"¿No es ninguno? Preguntar a la IA":"Preguntar a la IA"}</button>`;
  else if(ia.busy) i=`<span class="note">Google no lo encuentra; la IA lo está buscando…</span>`;
  else if(ia.item) i=`<div class="best"><span class="label">Según la IA</span><div class="name">${esc(ia.item.title)}</div>${ia.item.snippet?`<div class="snip">${esc(ia.item.snippet)}</div>`:""}${ia.item.url?`<div class="code">IA · ${esc(hostOf(ia.item.url))}</div>`:""}<button type="button" class="btn primary block" data-ia="1">${esc(label)}</button></div>`;
  else if(ia.none) i=`<span class="note">La IA tampoco lo encuentra. Escribe el nombre a mano.</span>`;
  else i=`<span class="note">IA: ${esc(ia.err)}</span>`;
  return ia&&!has?i+h:h+i;   // si Google no tiene el código exacto, lo de la IA va primero
}
/* Primero los que llevan el código exacto (los buenos); los demás aparte, por si acaso. */
function webList(items, off, bestLabel){
  const best=!off&&bestLabel&&items[0]&&items[0].ean!==false?items[0]:null;
  const top=best?`<div class="best"><span class="label">Lo más probable</span><div class="name">${esc(best.title)}</div><div class="code">${esc(best.src)}${best.url?" · "+esc(hostOf(best.url)):""}</div><button type="button" class="btn primary block" data-bi="0">${esc(bestLabel)}</button></div>`:"";
  if(best) items=items.slice(1);
  const off1=best?1:0;
  const row=(x,i)=>`<button type="button" class="row" data-bi="${i}" ${off?"disabled":""}><span class="txt"><div class="name">${esc(x.title)}</div>${x.snippet?`<div class="snip">${esc(x.snippet)}</div>`:""}<div class="code">${esc(x.src)}${x.url?" · "+esc(hostOf(x.url)):""}</div></span></button>`;
  const ok=[], rest=[]; items.forEach((x,i)=>(x.ean===false?rest:ok).push(row(x,i+off1)));
  return top+(ok.length?`${rest.length||best?`<span class="label">${best?"Otros con el mismo código":"Coinciden con el código"}</span>`:""}<div class="list">${ok.join("")}</div>`:best?"":`<span class="note">Ninguna página tiene este código exacto.</span>`)
    +(rest.length?`<span class="label">Otros resultados (puede que no sean)</span><div class="list webrest">${rest.join("")}</div>`:"");
}
/* pick(nombre, descripcion, botón) */
function bindWeb(box, raw, pick){
  box.querySelectorAll("[data-bi]").forEach(b=>b.onclick=()=>{ const x=S.web.items[+b.dataset.bi], n=nameFromTitle(x.title); pick(n, fold(x.title)!==fold(n)?x.title:"", b); });
  box.querySelectorAll("[data-ia]").forEach(b=>b.onclick=()=>{ const x=S.web.ia.item; pick(String(x.title).toUpperCase().slice(0,120), x.snippet||"", b); });
  box.querySelectorAll("[data-askia]").forEach(b=>b.onclick=()=>iaSearch(raw));
}
async function webSearch(raw, again){
  if(!canRestricted()) return;
  if(S.web&&S.web.raw===raw&&(S.web.busy||!again)) return;
  S.web={raw,busy:true}; if(again) webRedraw();
  let w;
  try{ const r=await api("api_barSearch", S.tecnico.id, raw); w={raw,items:r&&r.items||[]}; }catch(err){ w={raw,items:[],err:webErr(err),net:err&&err.code==="network"}; }
  if(!S.web||S.web.raw!==raw) return;
  S.web=w; webRedraw();
  if(!w.net&&!w.items.some(x=>x.ean!==false)) iaSearch(raw);
}
async function iaSearch(raw){
  const w=S.web; if(!w||w.raw!==raw||w.busy||(w.ia&&w.ia.busy)) return;
  w.ia={busy:true}; webRedraw();
  let ia;
  try{ const r=await api("api_barIA", S.tecnico.id, raw); ia=r&&r.item?{item:r.item}:{none:true}; }catch(err){ ia={err:iaErr(err)}; }
  if(S.web!==w) return;
  w.ia=ia; webRedraw();
}

/* Nuevo producto → «Buscar por código de barras». */
function nameFromTitle(t){
  let n=String(t||"").replace(/^(amazon\.[a-z.]+|ebay|aliexpress)\s*:\s*/i,"");
  const parts=n.split(/\s+[|–—]\s+|\s+-\s+/).map(x=>x.trim()).filter(Boolean);
  if(parts.length>1&&parts[0].length>=8) n=parts[0];
  n=n.replace(/\b(ean|ref\.?|c[oó]digo)\s*:?\s*\d{8,14}\b/ig,"").replace(/\b\d{12,14}\b/g,"").replace(/[\s,;:-]+$/,"").replace(/\s+/g," ").trim();
  return n.toUpperCase().slice(0,120);
}
function barSearch(raw){
  const box=$("#e_barbox"); if(!box) return;
  const known=prodByBar(raw);
  if(known){ toast(`Ese código de barras ya es de ${known.nombre}.`); go("ficha",{code:known.codigo}); return; }

  if(!(S.prefill&&S.prefill.bar)) S.newBar=raw;

}

}

function nextCode(){
  let n=0; for(const c of S.products.keys()){ const m=/^MAT-(\d+)$/.exec(c); if(m) n=Math.max(n,+m[1]); }
  return "MAT-"+String(n+1).padStart(3,"0");
}

function viewEdit(){
  const p = S.editCode ? S.products.get(S.editCode) : null;
  const img = imgFor(p);
  const baseCant = p ? p.cantidad : null;
  const pre = !p && S.prefill ? S.prefill : null;

        S.busy=false;
        const nb=pre&&pre.bar||S.newBar;
        if(nb){ go("ficha",{code:r.product.codigo}); linkBar(nb,r.product.codigo); return; }
        toast("Guardado"); go("ficha",{code:r.product.codigo}); return;

      if(err&&err.code==="exists"){ if(pre&&pre.cat){ toast(`${codigo} ya está en el almacén.`); go("ficha",{code:codigo}); return; } toast(`Ya existe un producto con el código ${codigo}.`); const c=$("#e_codigo"); if(c) c.value=nextCode(); }

  };

    $("#e_del").onclick=()=>{ $("#e_confirm").hidden=false; $("#e_del").hidden=true; };
    $("#e_no").onclick=()=>{ $("#e_confirm").hidden=true; $("#e_del").hidden=false; };

  }

function viewAdminLock(){
  const mode = S.changePw ? "change" : (S.hasPassword ? "login" : "first");
  app.innerHTML = `<form class="login" id="pw" novalidate>
    <div class="lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
    <h2>${mode==="first"?"Crea tu contraseña de acceso restringido":mode==="change"?"Nueva contraseña":"Acceso restringido"}</h2>
    <p class="note">${mode==="login"?"Escribe la contraseña para ver el historial.":"Con esta contraseña verás el historial de movimientos y podrás editar la lista de técnicos. Mínimo 6 caracteres."}</p>
    <label class="field"><span class="label">Contraseña</span><input id="pw1" type="password" autocomplete="${mode==="login"?"current-password":"new-password"}"></label>
    ${mode!=="login"?'<label class="field"><span class="label">Repite la contraseña</span><input id="pw2" type="password" autocomplete="new-password"></label>':""}
    <button class="btn primary block" type="submit">${mode==="login"?"Entrar":"Guardar contraseña"}</button>
    ${mode==="change"?'<button class="linkbtn" type="button" id="pw_cancel">Cancelar</button>':""}
  </form>`;
  const f=$("#pw");
  const c=$("#pw_cancel"); if(c) c.onclick=()=>{ S.changePw=false; viewAdmin(); };
  f.onsubmit=async e=>{
    e.preventDefault();
    const pw=$("#pw1").value||"", btn=f.querySelector('button[type=submit]');
    if(mode!=="login"){
      if(pw.length<6){ toast("La contraseña debe tener al menos 6 caracteres."); return; }
      if(pw!==($("#pw2").value||"")){ toast("Las dos contraseñas no coinciden."); return; }
    }
    btn.disabled=true;
    try{
      if(mode==="first"){ const r=await api("api_adminSetup", S.tecnico.id, pw); S.hasPassword=true; S.adminToken=r.token; unlockAdmin(); toast("Contraseña guardada"); }
      else if(mode==="change"){ await api("api_adminChangePassword", S.adminToken, pw); S.changePw=false; toast("Contraseña cambiada"); viewAdmin(); }
      else { const r=await api("api_adminLogin", S.tecnico.id, pw); S.adminToken=r.token; if(r.moves){ S.hist=r.moves; S.sheetUrl=r.sheetUrl||""; } unlockAdmin(!!r.moves); }
    }catch(err){
      btn.disabled=false;
      if(err&&err.code==="wrong"){ toast("Contraseña incorrecta."); $("#pw1").value=""; $("#pw1").focus(); }
      else if(err&&err.code==="fixed"){ S.changePw=false; toast("La contraseña es fija. Para cambiarla, cámbiala en Apps Script."); viewAdmin(); }
      else if(err&&err.code==="exists"){ S.hasPassword=true; toast("La contraseña ya estaba creada. Escríbela para entrar."); viewAdminLock(); }
      else if(err&&err.code==="auth"){ S.adminOk=false; S.adminToken=null; toast("Tu sesión de acceso restringido ha caducado. Vuelve a entrar."); S.changePw=false; viewAdminLock(); }
      else handleWriteError(err);
    }
  };
  setTimeout(()=>{ const i=$("#pw1"); if(i) i.focus(); },50);
}

function unlockAdmin(haveHist){
  S.adminOk=true; S.adminTab=S.adminWant||"hist"; S.adminWant=null; S.lastActive=Date.now();

}
async function loadHist(){
  try{ const r=await api("api_history", S.adminToken); S.hist=r.moves||[]; S.sheetUrl=r.sheetUrl||""; if(S.view==="admin"&&S.adminTab==="hist") viewHist(); }
  catch(err){ adminError(err); }
}
function adminError(err){
  if(err&&err.code==="auth"){ S.adminOk=false; S.adminToken=null; toast("Tu sesión de acceso restringido ha caducado. Vuelve a entrar."); if(S.view==="admin") viewAdmin(); }

}

function histFiltered(){
  const q=S.hf.q.trim().toLowerCase();
  return S.hist.filter(m=>(!S.hf.tec||m.tecnico===S.hf.tec)&&(!S.hf.tipo||m.tipo===S.hf.tipo)&&(!q||fold((m.producto||"")+" "+(m.codigo||"")+" "+(m.comunidad||"")+" "+(m.empresa||"")).includes(fold(q))));
}
function drawHist(){
  const el=$("#h_list"); if(!el) return;
  const rows=histFiltered();
  if(!S.hist.length){ el.innerHTML='<div class="list"><div class="empty">Todavía no hay movimientos (o se están cargando). Aquí aparecerá cada vez que alguien saque o ingrese material.</div></div>'; return; }
  el.innerHTML = `<div class="label" style="margin-bottom:6px">${rows.length} movimiento${rows.length===1?"":"s"}</div>
    <div class="list">${rows.length?rows.slice(0,300).map(m=>{
      const d=Number(m.delta)||0;
      const qty = m.tipo==="edicion" ? esc(m.detalle||"") : `<b class="d ${d<0?'neg':'pos'}">${d>0?"+":""}${d}</b> · quedan ${m.despues}`;
      return `<button class="hrow" data-open="${esc(m.codigo)}">
        <span class="htipo t-${esc(m.tipo)}">${esc(TIPOS[m.tipo]||m.tipo)}</span>

        <span class="hwho"><b>${esc(m.tecnico||"—")}</b>${m.comunidad?`<span class="com">${esc(m.comunidad)}</span>`:""}<span>${fmtDate(m.fecha)}</span></span></button>`;}).join(""):'<div class="empty">Ningún movimiento coincide con el filtro.</div>'}</div>
    ${rows.length>300?'<p class="note">Se muestran los 300 más recientes. Descarga el CSV para verlos todos.</p>':""}`;
}
async function exportCsv(){
  const rows=histFiltered();
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const lines=[["Fecha","Hora","Técnico","Empresa","Comunidad","Tipo","Código","Producto","Cantidad","Stock antes","Stock después","Detalle"].map(q).join(";")];
  rows.forEach(m=>{ const d=new Date(m.fecha); lines.push([d.toLocaleDateString("es-ES"),d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}),m.tecnico,m.empresa||"",m.comunidad||"",TIPOS[m.tipo]||m.tipo,m.codigo,m.producto,m.delta,m.antes,m.despues,m.detalle||""].map(q).join(";")); });
  try{ saveFile(`historial-almacen-${new Date().toISOString().slice(0,10)}.csv`, BOM+lines.join("\r\n")); }
  catch(e){ toast("No se pudo descargar. Ábrelo en la hoja de Google."); }
}

function qrCanvas(text){

/* Downloaded label: square, 4 x 4 cm at 300 ppp (472 px), with the size written in the PNG so it prints at 4 cm. */
const LABEL_CM=4;
function labelPng(title,code,text){
  const qr=qrCanvas(text); const W=Math.round(LABEL_CM/2.54*300); const c=document.createElement("canvas"); c.width=W;c.height=W;
  const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,W,W); g.imageSmoothingEnabled=false;
  const q=Math.round(W*.70); g.drawImage(qr,(W-q)/2,12,q,q); g.fillStyle="#111"; g.textAlign="center";
  g.font="bold 28px Arial, sans-serif"; wrapText(g,title,W/2,q+42,W-24,28);
  g.font=`bold ${Math.min(30,Math.floor((W-16)/(String(code).length*0.6)))}px monospace`; g.fillText(code,W/2,W-14);
  return new Promise(r=>c.toBlob(async b=>{ try{ r(await pngDpi(b,300)); }catch(e){ r(b); } },"image/png"));
}
/* Adds a pHYs chunk (pixels per metre) right after the PNG header. */
async function pngDpi(blob,dpi){
  const src=new Uint8Array(await blob.arrayBuffer()), ppm=Math.round(dpi/0.0254);
  const chunk=new Uint8Array(21), dv=new DataView(chunk.buffer);
  dv.setUint32(0,9); chunk.set([112,72,89,115],4); dv.setUint32(8,ppm); dv.setUint32(12,ppm); chunk[16]=1;
  let crc=-1; for(let i=4;i<17;i++){ crc^=chunk[i]; for(let k=0;k<8;k++) crc=(crc>>>1)^(0xEDB88320&-(crc&1)); }
  dv.setUint32(17,(crc^-1)>>>0);
  const at=33, out=new Uint8Array(src.length+21); out.set(src.subarray(0,at)); out.set(chunk,at); out.set(src.subarray(at),at+21);
  return new Blob([out],{type:"image/png"});
}
/* Print sheet: A4, 4 labels per row, exact size in cm, dashed lines to cut along. */
function printLabels(items,cm){
  if(!items.length){ toast("Marca al menos una etiqueta."); return; }
  let sheet=$("#printsheet"); if(!sheet){ sheet=document.createElement("div"); sheet.id="printsheet"; document.body.appendChild(sheet); }
  sheet.style.setProperty("--lbl",cm+"cm");
  sheet.innerHTML=items.map(it=>`<div class="lbl"><img src="${qrCanvas(it.text).toDataURL("image/png")}" alt=""><b>${esc(it.title)}</b><span${it.code.length>11?` style="font-size:calc(var(--lbl) * ${(0.99/it.code.length).toFixed(4)})"`:""}>${esc(it.code)}</span></div>`).join("");
  const clean=()=>{ window.removeEventListener("afterprint",clean); sheet.innerHTML=""; };
  window.addEventListener("afterprint",clean);
  setTimeout(()=>window.print(),300);
}
function wrapText(g,t,x,y,max,lh){ const words=String(t).split(" "); let line="",lines=[]; for(const w of words){ const tt=line?line+" "+w:w; if(g.measureText(tt).width>max&&line){lines.push(line);line=w}else line=tt;} lines.push(line); lines.slice(0,2).forEach((l,i)=>g.fillText(l,x,y+i*lh)); }

function handleWriteError(err){
  const c=err&&err.code;
  if(c==="busy") toast("Otra persona está cambiando el inventario ahora mismo. Inténtalo en unos segundos.");
  else if(c==="tecnico"){ logout("Tu nombre ya no está en la lista de técnicos. Habla con Xavi."); }
  else if(c==="network"||c==="offline") toast(netMsg());
  else if(c==="gone") toast("Este producto ya no existe.");
  else if(c==="too_large") toast("La foto es demasiado grande.");
  else if(c==="server"&&/is not defined/.test(err.msg||"")) toast("Al servidor de Google le falta una parte ("+String(err.msg).slice(0,60)+"). Hay que pegar servidor.gs en Código.gs y hacer Nueva versión.");
  else if(c==="server"||c==="bad") toast("Error del servidor"+(err.msg?": "+String(err.msg).slice(0,160):"")+". Mándale una captura a Claude.");
  else toast("No se pudo guardar. Inténtalo de nuevo.");
}

/* Stock moves show at once; the server confirms in the background and the number is put back if it refuses. */
const PEND=new Map();
async function move(code,delta){
  const p=S.products.get(code); if(!p||S.busy||!S.tecnico) return;
  if(p.cantidad+delta<0){ toast(`Solo quedan ${p.cantidad}. No puedes sacar ${-delta}.`); return; }
  p.cantidad+=delta; PEND.set(code,(PEND.get(code)||0)+1);
  toast(delta<0?`Sacadas ${-delta} uds. Quedan ${p.cantidad}.`:`Añadidas ${delta} uds. Hay ${p.cantidad}.`);
  S.amount=1; if(S.view==="ficha") render();
  let r=null;
  try{ r=await api("api_move", S.tecnico.id, code, delta, S.destino); }
  catch(err){
    const q=S.products.get(code); if(q) q.cantidad-=delta;
    if(err&&err.code==="short") toast(`No se guardó: solo quedan ${err.cur}.`);
    else handleWriteError(err);
  }
  finally{
    const n=(PEND.get(code)||1)-1; if(n) PEND.set(code,n); else PEND.delete(code);
    const q=S.products.get(code); if(r&&q&&!PEND.has(code)){ q.cantidad=r.next; remember("qty",code,r.next); }
    if(S.view==="ficha"&&S.code===code) render();
    if(r) refreshMoves();
  }
}

function watchMoves(code){
  if(!code) return;
  S.unMoves=()=>{};
  if(!S.adminOk||!S.adminToken){ S.moves=[]; return; }
  api("api_productMoves", code, S.adminToken).then(m=>{ if(S.view==="ficha"&&S.code===code){ S.moves=m||[]; renderLog(); } }).catch(()=>{});
}
function refreshMoves(){ if(S.view==="ficha"&&S.code){ S.unMoves=null; watchMoves(S.code); } }
function blobToBase64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(blob); }); }

function shrink(file,max){
  return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(img.src); c.toBlob(b=>b?res(b):rej(new Error("blob")),"image/jpeg",0.82); }; img.onerror=rej; img.src=URL.createObjectURL(file); });
}

function codeFromScan(text){
  let t=String(text||"").trim();
  const m=/[?&]p=([^&#]+)/.exec(t); if(m) t=m[1];
  else { const i=t.indexOf("#"); if(i>=0) t=t.slice(i+1); else if(/^https?:/i.test(t)) t=""; }
  return normCode(decodeURIComponent(t));
}

function handleScanText(found, fmt){
  const raw=String(found||"").trim();
  /* A manufacturer's barcode (EAN…), not one of our QR labels. */
  const isBar=!/^https?:/i.test(raw)&&!raw.includes("#")&&(isBarText(raw)||(fmt&&fmt!=="qr_code"));
  const byBar=isBar?prodByBar(raw):null;
  let code=codeFromScan(found);
  if(isBar&&!S.products.has(code)) code=byBar?byBar.codigo:"";
  if(S.scanFor==="bar") S.scanFor=null;
  if(S.scanFor==="newbar"){
    S.scanFor=null;
    if(!isBar){ toast("Eso es un QR de la app. Escanea el código de barras que trae el producto."); return; }
    if(S.view==="editar") barSearch(raw);
    return;
  }
  if(S.scanFor==="link"){
    S.scanFor=null;
    if(!isBar){ toast("Eso es un QR de la app. Escanea el código de barras que trae el producto de fábrica."); return; }
    if(S.view==="ficha"&&S.code===S.linkCode) linkBar(raw,S.linkCode);
    return;
  }
  if(S.scanFor==="count"){
    S.scanFor=null;
    if(S.view==="admin"&&S.adminTab==="rec"&&S.adminOk){
      if(isBar&&!code) toast(`El código de barras ${raw} no está en ningún producto.`);
      else if(code&&S.products.has(code)){ S.rc.cur=code; S.rc.val=""; S.rc.w=!!weights()[code]; }
      else toast(code?`No hay ningún producto con el código ${code}.`:"Ese es el QR general. Escanea la etiqueta de un producto.");
      viewRecount(); return;
    }
  }
  if(isBar&&!code){ openBar(raw); return; }
  if(!code){ go("buscar"); toast("QR general: busca el producto."); return; }
  if(S.products.has(code)) go("ficha",{code});
  else { S.q=code; go("buscar"); toast(`No hay ningún producto con el código ${code}.`); }
}

/* Live scanner: camera preview, reads the QR on its own (BarcodeDetector when the phone has it, jsQR otherwise). */
const SCAN={stream:null,raf:0,det:null,busy:false,zx:null,n:0,cand:null};
/* A barcode only counts after the same number has been read several times over at least a second,
   and EAN/UPC numbers must pass their check digit: a quick misread never gets through. */
const BAR_CONFIRM_MS=1000, BAR_CONFIRM_READS=3;
/* Phone movement while scanning (accelerometer): shows «¡No muevas el móvil!» and restarts the confirmation. */
const MOVE={at:0,last:null,on:false};
function onMotion(e){
  const a=e.acceleration, r=e.rotationRate; let moved=false;
  if(a&&a.x!=null){ moved=Math.hypot(a.x||0,a.y||0,a.z||0)>1.5; }
  else if(e.accelerationIncludingGravity){ const g=e.accelerationIncludingGravity, l=MOVE.last; if(l) moved=Math.hypot(g.x-l.x,g.y-l.y,g.z-l.z)>1.8; MOVE.last={x:g.x,y:g.y,z:g.z}; }
  if(r&&Math.max(Math.abs(r.alpha||0),Math.abs(r.beta||0),Math.abs(r.gamma||0))>40) moved=true;
  if(moved) MOVE.at=performance.now();
}
function watchMotion(on){
  if(on===MOVE.on) return; MOVE.on=on; MOVE.at=0; MOVE.last=null;
  if(on) window.addEventListener("devicemotion",onMotion); else window.removeEventListener("devicemotion",onMotion);
  const w=$("#scanwarn"); if(w) w.hidden=true;
}
const moving=()=>MOVE.on&&["bar","newbar","link"].includes(S.scanFor)&&performance.now()-MOVE.at<700;
function barCheckOk(t){
  t=String(t||"").trim();
  if(!/^\d+$/.test(t)||![8,12,13,14].includes(t.length)) return true;
  const d=t.split("").map(Number), chk=d.pop();
  const sum=d.reverse().reduce((a,x,i)=>a+x*(i%2===0?3:1),0);
  return (10-sum%10)%10===chk;
}
const BAR_FORMATS=["ean_13","ean_8","upc_a","upc_e","code_128","code_39","itf"];
/* Phones without a built-in barcode reader (iPhone) use ZXing, loaded only when needed. */
const ZX_URLS=["https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js","https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"];
let zxLoading=null;
function loadZx(){
  if(window.ZXing) return Promise.resolve(window.ZXing);
  return zxLoading||(zxLoading=loadScript(ZX_URLS).then(()=>window.ZXing).catch(()=>{ zxLoading=null; return null; }));
}
function zxReader(hard){
  const Z=window.ZXing; if(!Z) return null;
  const F=Z.BarcodeFormat, hints=new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39,F.ITF]);
  if(hard) hints.set(Z.DecodeHintType.TRY_HARDER,true);
  const r=new Z.MultiFormatReader(); r.setHints(hints); return r;
}
function zxDecode(reader, canvas){
  const Z=window.ZXing;
  try{ const res=reader.decodeWithState(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(canvas)))); return res?{text:res.getText(),format:"barcode"}:null; }
  catch(e){ return null; }
  finally{ try{ reader.reset(); }catch(e){} }
}
async function makeDetector(){
  if(SCAN.det!==null&&SCAN.det!==undefined) return;
  try{
    if("BarcodeDetector" in window){ const sup=await BarcodeDetector.getSupportedFormats(); const f=["qr_code",...BAR_FORMATS].filter(x=>sup.includes(x)); if(f.includes("qr_code")){ SCAN.det=new BarcodeDetector({formats:f}); SCAN.detBars=f.includes("ean_13"); return; } }
  }catch(e){}
  SCAN.det=false;
}
function closeScanner(){
  watchMotion(false);
  cancelAnimationFrame(SCAN.raf); SCAN.raf=0;
  if(SCAN.stream){ SCAN.stream.getTracks().forEach(t=>t.stop()); SCAN.stream=null; }
  const v=$("#scanvideo"); if(v) v.srcObject=null;
  $("#scanner").hidden=true;
}
async function openScanner(){
  /* iPhone asks permission for the motion sensor; it must be asked right on the tap. */
  try{ if(window.DeviceMotionEvent&&typeof DeviceMotionEvent.requestPermission==="function") DeviceMotionEvent.requestPermission().then(r=>{ if(r==="granted"&&SCAN.stream) watchMotion(true); }).catch(()=>{}); }catch(e){}
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)||IN_GAS){ $("#qrfile").click(); return; }
  SCAN.cand=null;
  $("#scanner").hidden=false; $("#scanmsg").textContent=S.scanFor==="link"||S.scanFor==="bar"||S.scanFor==="newbar"?"Apunta al código de barras del producto":"Apunta al código QR";
  try{
    SCAN.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
  }catch(e){
    closeScanner(); toast("No se pudo abrir la cámara. Haz una foto del QR."); $("#qrfile").click(); return;
  }
  if($("#scanner").hidden){ closeScanner(); return; }
  watchMotion(true);
  const v=$("#scanvideo"); v.srcObject=SCAN.stream; v.setAttribute("playsinline",""); try{ await v.play(); }catch(e){}
  await makeDetector();
  if(!(SCAN.det&&SCAN.detBars)) loadZx().then(()=>{ if(!SCAN.zx) SCAN.zx=zxReader(false); });
  const c=document.createElement("canvas"), g=c.getContext("2d",{willReadFrequently:true});
  const c2=document.createElement("canvas"), g2=c2.getContext("2d",{willReadFrequently:true});
  let last=0;
  const tick=async t=>{
    if(!SCAN.stream) return;
    SCAN.raf=requestAnimationFrame(tick);
    const mv=moving(), w=$("#scanwarn"); if(w&&w.hidden===mv) w.hidden=!mv;
    if(mv){ SCAN.cand=null; return; }
    if(SCAN.busy||t-last<120||v.readyState<2) return;
    last=t; SCAN.busy=true;
    try{
      let found=null, fmt="qr_code";
      SCAN.n++;
      if(SCAN.det){ const r=await SCAN.det.detect(v); if(r&&r[0]){ found=r[0].rawValue; fmt=r[0].format; } }
      else if(typeof jsQR!=="undefined"){
        const k=Math.min(1,640/Math.max(v.videoWidth,v.videoHeight)); c.width=Math.round(v.videoWidth*k); c.height=Math.round(v.videoHeight*k);
        g.drawImage(v,0,0,c.width,c.height);
        const r=jsQR(g.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:"dontInvert"});
        if(r&&r.data) found=r.data;
      }
      /* Barcodes need more detail than a QR: every other frame, a bigger picture goes to ZXing. */
      if(!found&&SCAN.zx&&!(SCAN.det&&SCAN.detBars)&&SCAN.n%2===0){
        const k=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight)); c2.width=Math.round(v.videoWidth*k); c2.height=Math.round(v.videoHeight*k);
        g2.drawImage(v,0,0,c2.width,c2.height);
        const r=zxDecode(SCAN.zx,c2); if(r){ found=r.text; fmt=r.format; }
      }
      if(found&&fmt!=="qr_code"){
        const now=performance.now();
        if(!barCheckOk(found)) found=null;
        else if(!SCAN.cand||SCAN.cand.text!==found){ SCAN.cand={text:found,n:1,t0:now}; found=null; }
        else { SCAN.cand.n++; if(SCAN.cand.n<BAR_CONFIRM_READS||now-SCAN.cand.t0<BAR_CONFIRM_MS) found=null; }
        if(!found&&SCAN.cand) $("#scanmsg").textContent="Leyendo el código… no muevas el móvil";
      }
      if(found){ SCAN.cand=null; if(navigator.vibrate) navigator.vibrate(60); closeScanner(); handleScanText(found,fmt); }
    }catch(e){}
    finally{ SCAN.busy=false; }
  };
  SCAN.raf=requestAnimationFrame(tick);
}
$("#scanclose").onclick=()=>{ S.scanFor=null; closeScanner(); };
$("#scanphoto").onclick=()=>{ closeScanner(); $("#qrfile").click(); };
/* Barcode too worn to read: type the number printed under the bars. */
$("#scantype").onclick=()=>{
  const v=prompt("Escribe el número que hay debajo de las barras");
  closeScanner();
  const t=String(v||"").replace(/\s+/g,"");
  if(!t){ S.scanFor=null; return; }
  if(!/^[0-9A-Za-z._\/+-]{4,40}$/.test(t)){ S.scanFor=null; toast("Ese número no parece un código de barras."); return; }
  handleScanText(t,"manual");
};
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState!=="visible"&&SCAN.stream) closeScanner(); });

$("#qrfile").addEventListener("change",async e=>{
  const file=e.target.files[0]; e.target.value=""; if(!file) return;
  if(typeof jsQR==="undefined"){ toast("El lector de QR no ha cargado. Recarga la página."); return; }
  toast("Leyendo código…");
  try{
    const img=new Image(); img.src=URL.createObjectURL(file); await img.decode();
    let found=null, fmt="qr_code";
    await makeDetector();
    if(SCAN.det){ try{ const r=await SCAN.det.detect(img); if(r&&r[0]){ found=r[0].rawValue; fmt=r[0].format; } }catch(e){} }
    for(const max of found?[]:[1000,1600,700]){
      const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas");
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      const g=c.getContext("2d",{willReadFrequently:true}); g.drawImage(img,0,0,c.width,c.height);
      const r=jsQR(g.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:"attemptBoth"});
      if(r&&r.data){ found=r.data; break; }
    }
    if(!found&&!(SCAN.det&&SCAN.detBars)&&await loadZx()){
      const rd=zxReader(true);
      for(const max of [1600,1000,2400]){
        const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas");
        c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d",{willReadFrequently:true}).drawImage(img,0,0,c.width,c.height);
        const r=zxDecode(rd,c); if(r){ found=r.text; fmt=r.format; break; }
      }
    }
    URL.revokeObjectURL(img.src);
    if(found&&fmt!=="qr_code"&&!barCheckOk(found)) found=null;
    if(!found){ S.scanFor=null; toast("No se ve ningún código. Acércate y haz la foto con buena luz."); return; }
    handleScanText(found,fmt);
  }catch(err){ toast("No se pudo leer la foto."); }
});

$("#back").onclick=()=>go(S.tecnico?"buscar":"login");
$("#who").onclick=()=>logout("Sesión cerrada. Elige tu nombre para entrar.");
app.addEventListener("click",e=>{ const b=e.target.closest("[data-open]"); if(b&&S.products.has(b.dataset.open)) go("ficha",{code:b.dataset.open}); });

/* Shared phones: after 15 minutes without use, ask for the name again. */
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,()=>{S.lastActive=Date.now();},{passive:true}));
setInterval(()=>{ if(S.tecnico&&Date.now()-S.lastActive>IDLE_MS) logout("Sesión cerrada por inactividad. Elige tu nombre para entrar."); },30000);

function fromHash(){ const c=normCode(location.hash.slice(1)); if(c) go("ficha",{code:c}); }
window.addEventListener("hashchange",fromHash);

function applyData(r){
  if(r.products){ const m=new Map(); r.products.forEach(x=>{ const old=S.products.get(x.codigo), q=fresh("qty",x.codigo); m.set(x.codigo,{...x,cantidad:PEND.has(x.codigo)&&old?old.cantidad:q?q.val:(Number(x.cantidad)||0)}); }); S.products=m; S.loaded=true; }
  if(r.techs){ S.techs=r.techs; S.techsLoaded=true; }
  if(r.niveles) S.niv={...r.niveles};
  if(r.baldas) S.baldas={...r.baldas};
  if(r.lados) S.lados={...r.lados};
  if(r.barras) S.bars=new Map(r.barras.map(([k,c])=>[barKey(k),String(c)]));
  if(r.loans){
    const list=r.loans.filter(l=>!fresh("gone",l.id));
    for(const [id] of RECENT.added){ const e=fresh("added",id); if(e&&!fresh("gone",id)&&!list.some(l=>l.id===id)) list.push(e.val); }
    S.loans=list;
  }
  if(r.clientes) S.clientes=r.clientes;
  if(r.proveedores) S.proveedores=r.proveedores;
  if(r.hasPassword!==undefined) S.hasPassword=r.hasPassword;
  if(r.catVer!==undefined&&r.catVer!==S.catVer){ S.catVer=r.catVer; if(S.cat&&S.cat.ver!==S.catVer&&S.q.trim()) ensureCat(); }
}
function typing(){ const a=document.activeElement; return a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT"); }
/* Each publish changes APP_VERSION. The phone checks for a newer copy of the page and reloads by itself,
   so nobody stays on an old version because of the browser cache. */
const APP_VERSION="2026-10-08.7";
async function checkUpdate(){
  try{
    const url=location.origin+location.pathname;
    const txt=await (await fetch(url+"?v="+Date.now(),{cache:"no-store"})).text();
    const m=/const APP_VERSION="([^"]+)"/.exec(txt); if(!m||m[1]===APP_VERSION) return;
    let tried=""; try{ tried=sessionStorage.getItem("almacen_upd")||""; }catch(e){}
    if(tried===m[1]) return;
    if(S.busy||PEND.size||WBUSY||typing()||S.view==="editar"||!$("#scanner").hidden) return;
    try{ sessionStorage.setItem("almacen_upd",m[1]); }catch(e){}
    await fetch(url,{cache:"reload"}).catch(()=>{});
    location.reload();
  }catch(e){}
}
async function poll(){
  try{
    const seq=WSEQ;
    const r=await api("api_poll");
    if(seq!==WSEQ||WBUSY) return;
    applyData(r); saveCache({...r,loans:S.loans});
    if(S.busy) return;
    if(S.view==="login"){ if($("#l_q")) drawLoginResults(); else render(); return; }
    if(S.view==="admin"){ if(S.adminOk&&S.adminTab==="ped"&&!typing()) drawLowList(); return; }
    if(S.view==="editar"||S.view==="destino"||typing()) return;
    if(S.view==="ficha"){ render(); refreshMoves(); return; }
    render();
  }catch(e){}
}

(async function boot(){
  render();
  if(BOOT.p) S.pending=normCode(BOOT.p);
  catLoad();
  const cached=IN_GAS?null:loadCache();
  if(cached&&cached.products&&cached.techs){ applyData(cached); render(); }
  /* First visit on this phone: ask for the technicians on their own so the name search works while the rest loads. */
  let full=false;
  if(!IN_GAS&&!(cached&&cached.techs)) api("api_techs").then(r=>{
    if(full||!r||!r.techs) return;
    applyData(r);
    if(S.view==="login"){ if($("#l_q")) drawLoginResults(); else render(); }
  }).catch(()=>{});
  try{
    const r=await api("api_bootstrap"); full=true; applyData(r); saveCache(r);
  }catch(err){
    if(!cached){
      app.innerHTML = err&&err.code==="no_instalado"
        ? '<div class="empty">La app aún no está instalada. Ejecuta «instalar» en el editor de Apps Script.</div>'
        : '<div class="empty">No se pudo cargar el inventario. Revisa la conexión y recarga la página.</div>';
      return;
    }
    toast(navigator.onLine===false?"Sin conexión: se muestran los últimos datos guardados.":"El servidor de Google no responde: se muestran los últimos datos guardados.");
  }
  if(!(S.view==="login"&&typing())) render(); else if($("#l_q")) drawLoginResults();
  setInterval(()=>{ if(document.visibilityState==="visible") poll(); }, 20000);
  if(!IN_GAS){ setTimeout(checkUpdate,3000); setInterval(checkUpdate,120000); document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") checkUpdate(); }); }
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") poll(); });
})();
</script>
